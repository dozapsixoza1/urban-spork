name: Compile Pawn

on:
  workflow_dispatch:
  push:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install runtimes
        shell: pwsh
        continue-on-error: true
        run: choco install vcredist2005 vcredist2008 vcredist2010 vcredist140 -y --no-progress

      - name: Unzip
        shell: pwsh
        run: Expand-Archive -Path src.zip -DestinationPath work -Force

      - name: RakNet include fix
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $has = Get-ChildItem work -Recurse -Filter Pawn_RakNet.inc
          $incdir = Get-ChildItem work -Recurse -Directory -Filter include |
            Select-Object -First 1

          if ($has) {
            Write-Host "Pawn_RakNet.inc already present"
          }
          else {
            $dot = Get-ChildItem work -Recurse -Filter Pawn.RakNet.inc |
              Select-Object -First 1

            if ($dot -and $incdir) {
              Copy-Item $dot.FullName (Join-Path $incdir.FullName "Pawn_RakNet.inc")
              Write-Host "Copied Pawn.RakNet.inc as Pawn_RakNet.inc"
            }
            else {
              Write-Host "WARNING: RakNet include not found"
            }
          }

      - name: Diagnose Pawn CMD aliases
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "========== FIND MAIN.PWN =========="

          $pwn = Get-ChildItem work -Recurse -Filter main.pwn |
            Sort-Object Length -Descending |
            Select-Object -First 1

          if (-not $pwn) {
            Write-Host "ERROR: main.pwn not found"
            exit 1
          }

          Write-Host "MAIN: $($pwn.FullName)"
          Write-Host "MAIN DIRECTORY: $($pwn.DirectoryName)"

          Write-Host "`n========== MAIN.PWN INCLUDES =========="

          Select-String -Path $pwn.FullName `
            -Pattern '^\s*#\s*include' |
            ForEach-Object {
              Write-Host "$($_.LineNumber): $($_.Line.Trim())"
            }

          $files = Get-ChildItem work -Recurse -File |
            Where-Object {
              $_.Name -match '^(pawn.?cmd|zcmd|y.?commands)\.inc$'
            }

          Write-Host "`n========== FOUND COMMAND INCLUDES =========="

          if (-not $files) {
            Write-Host "No command include files found"
          }

          foreach ($file in $files) {
            Write-Host "`n"
            Write-Host "=========================================="
            Write-Host "FILE: $($file.FullName)"
            Write-Host "=========================================="

            $lines = Get-Content $file.FullName
            $limit = [Math]::Min($lines.Count, 130)

            for ($i = 0; $i -lt $limit; $i++) {
              Write-Host ("{0,4}: {1}" -f ($i + 1), $lines[$i])
            }
          }

          Write-Host "`n========== ALL ALIAS DEFINITIONS =========="

          $sources = Get-ChildItem work -Recurse -File |
            Where-Object {
              $_.Extension -in @(".inc", ".pwn")
            }

          $matches = $sources |
            Select-String -Pattern '^\s*#\s*(define|if|elseif|endif).*alias|^\s*#\s*define\s+alias'

          if ($matches) {
            foreach ($match in $matches) {
              Write-Host "$($match.Path):$($match.LineNumber): $($match.Line.Trim())"
            }
          }
          else {
            Write-Host "No alias macro definitions found"
          }

          Write-Host "`n========== INCLUDE GUARDS =========="

          foreach ($file in $files) {
            Write-Host "`nFILE: $($file.FullName)"

            Select-String -Path $file.FullName `
              -Pattern '^\s*#\s*(if|ifdef|ifndef|define|endif)' |
              Select-Object -First 20 |
              ForEach-Object {
                Write-Host "$($_.LineNumber): $($_.Line.Trim())"
              }
          }

          Write-Host "`n========== DIAGNOSTICS COMPLETE =========="

      - name: Compile
        shell: pwsh
        run: |
          New-Item out -ItemType Directory -Force | Out-Null

          $pwn = Get-ChildItem work -Recurse -Filter main.pwn |
            Sort-Object Length -Descending |
            Select-Object -First 1

          $cc = Get-ChildItem work -Recurse -Filter pawncc.exe |
            Select-Object -First 1

          if (-not $pwn -or -not $cc) {
            Write-Host "ERROR: main.pwn or pawncc.exe not found"
            exit 1
          }

          Write-Host "Compiler: $($cc.FullName)"
          Write-Host "Source: $($pwn.FullName)"

          $opts = @("main.pwn", "-d3")

          Get-ChildItem work -Recurse -Directory -Filter include |
            ForEach-Object {
              $opts += ("-i" + $_.FullName)
            }

          Write-Host "`n========== COMPILER ARGUMENTS =========="
          $opts | ForEach-Object { Write-Host $_ }

          Push-Location $pwn.DirectoryName

          try {
            & $cc.FullName @opts *> "$env:GITHUB_WORKSPACE\out\compile.log"
            $compileExit = $LASTEXITCODE
          }
          catch {
            $_ | Out-String |
              Out-File "$env:GITHUB_WORKSPACE\out\compile.log" -Append
            $compileExit = 1
          }
          finally {
            Pop-Location
          }

          Write-Host "`nCompiler exit code: $compileExit"

          if (Test-Path "$($pwn.DirectoryName)\main.amx") {
            Copy-Item "$($pwn.DirectoryName)\main.amx" out\main.amx -Force
            Write-Host "main.amx found and copied"
          }
          else {
            Write-Host "main.amx was not generated"
          }

          Write-Host "`n========== COMPILER OUTPUT =========="

          if (Test-Path out\compile.log) {
            Get-Content out\compile.log -Tail 100
          }

          "Compiler exit code: $compileExit" |
            Out-File out\compiler_status.txt

          if ($compileExit -ne 0) {
            exit $compileExit
          }

          if (-not (Test-Path out\main.amx)) {
            Write-Host "ERROR: Compilation returned success but main.amx is missing"
            exit 1
          }

          Write-Host "Compilation succeeded"

      - name: Show error lines
        if: always()
        shell: pwsh
        run: |
          New-Item out -ItemType Directory -Force | Out-Null
          $report = @()

          if (Test-Path out\compile.log) {
            $errs = Get-Content out\compile.log |
              Where-Object {
                $_ -match '^(.+?)\((\d+)\)\s*:\s*(error|fatal)'
              } |
              Select-Object -First 30

            foreach ($e in $errs) {
              $report += $e

              if ($e -match '^(.+?)\((\d+)\)\s*:') {
                $f = $Matches[1]
                $n = [int]$Matches[2]
                $leaf = Split-Path $f -Leaf

                $p = Get-ChildItem work -Recurse -File -Filter $leaf |
                  Where-Object {
                    $_.FullName.Replace('\','/') -like "*$($f.Replace('\','/'))"
                  } |
                  Select-Object -First 1

                if (-not $p) {
                  $p = Get-ChildItem work -Recurse -File -Filter $leaf |
                    Select-Object -First 1
                }

                $report += "=== Source context: $f line $n"

                if ($p) {
                  $lines = Get-Content $p.FullName

                  for (
                    $i = [Math]::Max(1, $n - 3);
                    $i -le [Math]::Min($lines.Count, $n + 2);
                    $i++
                  ) {
                    $report += ("{0}: {1}" -f $i, $lines[$i - 1])
                  }
                }
                else {
                  $report += "Source file not found in archive"
                }
              }
            }

            if (-not $errs) {
              $report += "No standard Pawn compiler error lines matched."
              $report += "Check compile.log for the full output."
            }
          }
          else {
            $report += "compile.log was not created."
          }

          $report | Out-File out\error_lines.txt

          Write-Host "========== ERROR REPORT =========="
          $report | ForEach-Object { Write-Host $_ }

      - name: Upload diagnostics and build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-windows
          path: out/
          if-no-files-found: warn
