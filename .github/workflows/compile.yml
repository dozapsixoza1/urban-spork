name: Compile Pawn

on:
  workflow_dispatch:
  push:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install runtimes
        shell: pwsh
        continue-on-error: true
        run: |
          choco install vcredist2005 vcredist2008 vcredist2010 vcredist140 -y --no-progress

      - name: Extract source
        shell: pwsh
        run: |
          if (-not (Test-Path "src.zip")) {
            Write-Host "ERROR: src.zip not found"
            exit 1
          }

          Expand-Archive -Path src.zip -DestinationPath work -Force

      - name: Fix RakNet include
        shell: pwsh
        run: |
          $incdir = Get-ChildItem work -Recurse -Directory -Filter include |
            Select-Object -First 1

          if (-not $incdir) {
            Write-Host "ERROR: include directory not found"
            exit 1
          }

          $target = Join-Path $incdir.FullName "Pawn_RakNet.inc"

          if (-not (Test-Path $target)) {
            $source = Get-ChildItem work -Recurse -Filter Pawn.RakNet.inc |
              Select-Object -First 1

            if ($source) {
              Copy-Item $source.FullName $target
              Write-Host "RakNet include copied"
            }
          }

      - name: Diagnose source
        shell: pwsh
        run: |
          New-Item out -ItemType Directory -Force | Out-Null

          $pwn = Get-ChildItem work -Recurse -File -Filter main.pwn |
            Select-Object -First 1

          $compiler = Get-ChildItem work -Recurse -File -Filter pawncc.exe |
            Select-Object -First 1

          if (-not $pwn -or -not $compiler) {
            Write-Host "ERROR: main.pwn or pawncc.exe not found"
            exit 1
          }

          Write-Host "MAIN: $($pwn.FullName)"
          Write-Host "MAIN SIZE: $($pwn.Length) bytes"
          Write-Host "COMPILER: $($compiler.FullName)"

          Write-Host "`n========== FIRST 150 LINES =========="
          Get-Content $pwn.FullName -TotalCount 150

          Write-Host "`n========== MAIN FUNCTIONS =========="
          Select-String -Path $pwn.FullName `
            -Pattern 'public OnGameModeInit|public OnGameModeExit|public OnPlayerConnect|main\(' |
            Select-Object -First 40 |
            ForEach-Object {
              Write-Host "$($_.LineNumber): $($_.Line.Trim())"
            }

          Write-Host "`n========== REGISTRATION DEBUG =========="
          Select-String -Path $pwn.FullName `
            -Pattern 'REG DEBUG|Password callback reached|OnPasswordHashed' |
            Select-Object -First 30 |
            ForEach-Object {
              Write-Host "$($_.LineNumber): $($_.Line.Trim())"
            }

          Write-Host "`n========== CONDITIONAL DIRECTIVES =========="
          Select-String -Path $pwn.FullName `
            -Pattern '^\s*#\s*(if|elseif|else|endif)\b' |
            Select-Object -First 150 |
            ForEach-Object {
              Write-Host "$($_.LineNumber): $($_.Line.Trim())"
            }

      - name: Compile main
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          New-Item out -ItemType Directory -Force | Out-Null

          $pwn = Get-ChildItem work -Recurse -File -Filter main.pwn |
            Select-Object -First 1

          $compiler = Get-ChildItem work -Recurse -File -Filter pawncc.exe |
            Select-Object -First 1

          if (-not $pwn -or -not $compiler) {
            Write-Host "ERROR: main.pwn or pawncc.exe not found"
            exit 1
          }

          Write-Host "Compiling: $($pwn.FullName)"
          Write-Host "Compiler: $($compiler.FullName)"

          $opts = @("main.pwn", "-d3")

          Get-ChildItem work -Recurse -Directory -Filter include |
            ForEach-Object {
              $opts += ("-i" + $_.FullName)
            }

          $compileLog = "$env:GITHUB_WORKSPACE\out\compile.log"

          Push-Location $pwn.DirectoryName

          try {
            & $compiler.FullName @opts *> $compileLog
            $compileExit = $LASTEXITCODE
          }
          catch {
            $_ | Out-String | Out-File $compileLog -Append
            $compileExit = 1
          }
          finally {
            Pop-Location
          }

          Write-Host "COMPILER EXIT CODE: $compileExit"

          $amxPath = Join-Path $pwn.DirectoryName "main.amx"

          if (Test-Path $amxPath) {
            $amx = Get-Item $amxPath
            Write-Host "Generated AMX size: $($amx.Length) bytes"
          }
          else {
            Write-Host "ERROR: main.amx was not generated"
          }

          Write-Host "`n========== COMPILER LOG =========="

          if (Test-Path $compileLog) {
            Get-Content $compileLog -Tail 150
          }

          "Compiler exit code: $compileExit" |
            Out-File out\compiler_status.txt

          $hasErrors = $false

          if (Test-Path $compileLog) {
            $hasErrors = [bool](Select-String `
              -Path $compileLog `
              -Pattern 'error\s+\d+|fatal error|Compilation aborted' `
              -Quiet)
          }

          if ($compileExit -ne 0 -or $hasErrors) {
            Write-Host "ERROR: compilation failed"
            exit 1
          }

          if (-not (Test-Path $amxPath)) {
            Write-Host "ERROR: main.amx missing"
            exit 1
          }

          $amx = Get-Item $amxPath

          if ($amx.Length -lt 1000000) {
            Write-Host "ERROR: AMX is suspiciously small: $($amx.Length) bytes"
            Write-Host "The file will not be published as a successful build."
            exit 1
          }

          Copy-Item $amxPath out\main.amx -Force

          Write-Host "Build validation passed."
          Write-Host "Final AMX size: $((Get-Item out\main.amx).Length) bytes"

      - name: Upload logs and AMX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-windows
          path: out/
          if-no-files-found: warn
