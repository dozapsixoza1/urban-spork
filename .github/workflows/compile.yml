name: Compile Pawn

on:
  workflow_dispatch:
  push:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source
        shell: pwsh
        run: |
          if (-not (Test-Path 'src.zip')) {
            Write-Host 'ERROR: src.zip not found'
            exit 1
          }

          Expand-Archive -Path src.zip -DestinationPath work -Force
          New-Item out -ItemType Directory -Force | Out-Null

      - name: Locate compiler and repair include paths
        shell: pwsh
        run: |
          $pwn = Get-ChildItem work -Recurse -File -Filter main.pwn |
            Select-Object -First 1

          if (-not $pwn) {
            Write-Host 'ERROR: main.pwn not found'
            exit 1
          }

          $compilerPath = Join-Path $pwn.DirectoryName 'pawncc.exe'

          if (Test-Path $compilerPath) {
            $compiler = Get-Item $compilerPath
          } else {
            $compiler = Get-ChildItem work -Recurse -File -Filter pawncc.exe |
              Select-Object -First 1
          }

          if (-not $compiler) {
            Write-Host 'ERROR: pawncc.exe not found'
            exit 1
          }

          Write-Host "SOURCE: $($pwn.FullName)"
          Write-Host "COMPILER: $($compiler.FullName)"

          Write-Host 'Searching for Pawn_RakNet include files...'

          $allFiles = Get-ChildItem work -Recurse -File

          $raknetFiles = $allFiles | Where-Object {
            $_.BaseName -ieq 'Pawn_RakNet' -or
            $_.BaseName -ieq 'Pawn.RakNet' -or
            $_.BaseName -ieq 'PawnRakNet'
          }

          foreach ($file in $raknetFiles) {
            Write-Host "Candidate: $($file.FullName)"
          }

          $includeDirs = @(
            Get-ChildItem work -Recurse -Directory |
              Where-Object { $_.Name -ieq 'include' } |
              ForEach-Object { $_.FullName }
          )

          $includeDirs += $raknetFiles |
            ForEach-Object { $_.DirectoryName }

          $includeDirs += $pwn.DirectoryName
          $includeDirs = $includeDirs | Sort-Object -Unique

          $expected = Join-Path $pwn.DirectoryName 'Pawn_RakNet.inc'

          if (-not (Test-Path $expected)) {
            $candidate = $raknetFiles |
              Where-Object { $_.Extension -ieq '.inc' } |
              Select-Object -First 1

            if ($candidate) {
              Copy-Item $candidate.FullName $expected -Force
              Write-Host "Created include alias: $expected"
            }
          }

          $includeDirs | Set-Content out\include_dirs.txt

          Write-Host 'Include directories:'
          $includeDirs | ForEach-Object { Write-Host $_ }

          if (-not (Test-Path $expected)) {
            Write-Host 'WARNING: Pawn_RakNet.inc was not found in the archive.'
            Write-Host 'The include may be missing entirely.'
          }

          $dllDirs = Get-ChildItem work -Recurse -File -Filter '*.dll' |
            ForEach-Object { $_.DirectoryName } |
            Sort-Object -Unique

          $env:PATH = (
            ($dllDirs -join ';') +
            ';' +
            $compiler.DirectoryName +
            ';' +
            $env:PATH
          )

          "SOURCE=$($pwn.FullName)" | Set-Content out\paths.txt
          "COMPILER=$($compiler.FullName)" | Add-Content out\paths.txt

      - name: Remove Ctrl-Z bytes
        shell: pwsh
        run: |
          Get-ChildItem work -Recurse -File |
            Where-Object { $_.Extension -in @('.pwn', '.inc') } |
            ForEach-Object {
              $file = $_
              $bytes = [IO.File]::ReadAllBytes($file.FullName)

              if ($bytes -contains 26) {
                $clean = [Collections.Generic.List[byte]]::new()

                foreach ($b in $bytes) {
                  if ($b -ne 26) {
                    $clean.Add($b)
                  }
                }

                [IO.File]::WriteAllBytes(
                  $file.FullName,
                  $clean.ToArray()
                )

                Write-Host "Cleaned $($file.FullName)"
              }
            }

      - name: Install Visual C++ 2010 Runtime
        shell: pwsh
        run: |
          choco install vcredist2010 -y --no-progress
          Write-Host "Runtime installation exit code: $LASTEXITCODE"
          exit 0

      - name: Compile main
        shell: pwsh
        run: |
          $pwn = Get-ChildItem work -Recurse -File -Filter main.pwn |
            Select-Object -First 1

          if (-not $pwn) {
            Write-Host 'ERROR: main.pwn not found'
            exit 1
          }

          $compilerPath = Join-Path $pwn.DirectoryName 'pawncc.exe'

          if (Test-Path $compilerPath) {
            $compiler = Get-Item $compilerPath
          } else {
            $compiler = Get-ChildItem work -Recurse -File -Filter pawncc.exe |
              Select-Object -First 1
          }

          if (-not $compiler) {
            Write-Host 'ERROR: pawncc.exe not found'
            exit 1
          }

          $dllDirs = Get-ChildItem work -Recurse -File -Filter '*.dll' |
            ForEach-Object { $_.DirectoryName } |
            Sort-Object -Unique

          $env:PATH = (
            ($dllDirs -join ';') +
            ';' +
            $compiler.DirectoryName +
            ';' +
            $env:PATH
          )

          $includeDirs = @(
            Get-Content out\include_dirs.txt |
              Where-Object { $_ -and (Test-Path $_) }
          )

          $argsList = @($pwn.FullName, '-d3')

          foreach ($inc in $includeDirs) {
            $argsList += "-i$inc"
          }

          $log = Join-Path $env:GITHUB_WORKSPACE 'out\compile.log'

          Write-Host "COMPILING SOURCE: $($pwn.FullName)"
          Write-Host "USING COMPILER: $($compiler.FullName)"
          Write-Host "INCLUDE DIRECTORIES: $($includeDirs.Count)"

          Push-Location $compiler.DirectoryName

          try {
            & $compiler.FullName @argsList *> $log
            $compileExit = $LASTEXITCODE
          } catch {
            $_ | Out-String | Add-Content $log
            $compileExit = 1
          } finally {
            Pop-Location
          }

          Write-Host "COMPILER EXIT CODE: $compileExit"
          Get-Content $log -Tail 300

          if ($compileExit -ne 0) {
            exit 1
          }

          $amxPath = Join-Path $pwn.DirectoryName 'main.amx'

          if (-not (Test-Path $amxPath)) {
            Write-Host 'ERROR: main.amx was not generated'
            exit 1
          }

          $amx = Get-Item $amxPath

          Write-Host "AMX SIZE: $($amx.Length) bytes"

          if ($amx.Length -lt 1000000) {
            Write-Host 'ERROR: AMX is suspiciously small.'
            exit 1
          }

          Copy-Item $amxPath out\main.amx -Force
          Write-Host 'SUCCESS: main.amx copied to out.'

      - name: Upload diagnostics and AMX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-windows
          path: out/
          if-no-files-found: warn
