name: Compile Pawn Mod

on:
  push:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Visual C++ runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install vcredist2010 -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Visual C++ runtime installation failed."
          }

      - name: Extract source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $archive = Get-ChildItem $env:GITHUB_WORKSPACE `
            -Recurse -File -Filter "src.zip" |
            Select-Object -First 1

          if (-not $archive) {
            throw "src.zip not found."
          }

          $work = Join-Path $env:GITHUB_WORKSPACE "work"

          if (Test-Path $work) {
            Remove-Item $work -Recurse -Force
          }

          New-Item -ItemType Directory -Path $work | Out-Null
          Expand-Archive -LiteralPath $archive.FullName `
            -DestinationPath $work -Force

      - name: Locate files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:GITHUB_WORKSPACE "work"

          $compiler = Get-ChildItem $root -Recurse -File `
            -Filter "pawncc.exe" |
            Select-Object -First 1

          $source = Get-ChildItem $root -Recurse -File `
            -Filter "main.pwn" |
            Sort-Object Length -Descending |
            Select-Object -First 1

          if (-not $compiler) {
            throw "pawncc.exe not found."
          }

          if (-not $source) {
            throw "main.pwn not found."
          }

          "COMPILER=$($compiler.FullName)" >> $env:GITHUB_ENV
          "SOURCE=$($source.FullName)" >> $env:GITHUB_ENV
          "SOURCE_DIR=$($source.DirectoryName)" >> $env:GITHUB_ENV

          Write-Host "Compiler: $($compiler.FullName)"
          Write-Host "Source: $($source.FullName)"
          Write-Host "Source size: $($source.Length) bytes"

      - name: Compile Pawn mod
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $compiler = $env:COMPILER
          $source = $env:SOURCE
          $sourceDir = $env:SOURCE_DIR
          $root = Join-Path $env:GITHUB_WORKSPACE "work"

          $env:PATH = "$(Split-Path $compiler -Parent);$sourceDir;$env:PATH"

          # Run the compiler from the source directory so relative
          # includes and project files resolve correctly.
          Push-Location $sourceDir

          try {
            $arguments = @(
              (Split-Path $source -Leaf),
              "-d3"
            )

            $includeDirs = Get-ChildItem $root -Directory -Recurse |
              Where-Object { $_.Name -ieq "include" } |
              Select-Object -ExpandProperty FullName -Unique

            foreach ($dir in $includeDirs) {
              $arguments += "-i$dir"
            }

            Write-Host "Running Pawn compiler..."
            Write-Host "Compiler: $compiler"
            Write-Host "Arguments:"
            $arguments | ForEach-Object { Write-Host "  $_" }

            & $compiler @arguments
            $code = $LASTEXITCODE

            Write-Host "Compiler exit code: $code"

            if ($code -ne 0) {
              throw "Pawn compilation failed with exit code $code."
            }
          }
          finally {
            Pop-Location
          }

          $amx = [System.IO.Path]::ChangeExtension($source, ".amx")

          if (-not (Test-Path $amx)) {
            throw "Compilation reported success, but main.amx was not created."
          }

          $size = (Get-Item $amx).Length
          Write-Host "AMX size: $size bytes"

          if ($size -lt 100000) {
            throw "AMX is suspiciously small ($size bytes). The full mod may not have compiled."
          }

          $output = Join-Path $env:GITHUB_WORKSPACE "out"
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          Copy-Item $amx (Join-Path $output "main.amx") -Force

          Write-Host "Compilation completed successfully."

      - name: Upload compiled mod
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-pawn-mod
          path: out/main.amx
          if-no-files-found: error
