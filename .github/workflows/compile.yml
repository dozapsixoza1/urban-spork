name: Compile Pawn

on:
  workflow_dispatch:
  push:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract source
        shell: pwsh
        run: |
          if (-not (Test-Path "src.zip")) {
            Write-Host "ERROR: src.zip not found"
            exit 1
          }

          Expand-Archive -Path src.zip -DestinationPath work -Force

      - name: Diagnose source
        shell: pwsh
        run: |
          New-Item out -ItemType Directory -Force | Out-Null

          $pwn = Get-ChildItem work -Recurse -File -Filter main.pwn |
            Select-Object -First 1

          $compiler = Get-ChildItem work -Recurse -File -Filter pawncc.exe |
            Select-Object -First 1

          if (-not $pwn -or -not $compiler) {
            Write-Host "ERROR: main.pwn or pawncc.exe not found"
            exit 1
          }

          Write-Host "MAIN: $($pwn.FullName)"
          Write-Host "MAIN SIZE: $($pwn.Length) bytes"
          Write-Host "COMPILER: $($compiler.FullName)"

          $lines = Get-Content $pwn.FullName

          Write-Host "`n========== SOURCE AROUND main() =========="

          $start = 640
          $end = [Math]::Min(710, $lines.Count)

          for ($i = $start; $i -le $end; $i++) {
            Write-Host ("{0}: {1}" -f $i, $lines[$i - 1])
          }

          Write-Host "`n========== SOURCE AROUND OnGameModeInit =========="

          $start = 8170
          $end = [Math]::Min(8220, $lines.Count)

          for ($i = $start; $i -le $end; $i++) {
            Write-Host ("{0}: {1}" -f $i, $lines[$i - 1])
          }

          Write-Host "`n========== COMMENT MARKERS =========="

          Select-String -Path $pwn.FullName `
            -Pattern '/\*|\*/' |
            Select-Object -First 100 |
            ForEach-Object {
              Write-Host "$($_.LineNumber): $($_.Line.Trim())"
            }

          Write-Host "`n========== REGISTRATION CALLBACKS =========="

          Select-String -Path $pwn.FullName `
            -Pattern 'OnPasswordHashed|OnDialogResponse|bcrypt_hash' |
            Select-Object -First 50 |
            ForEach-Object {
              Write-Host "$($_.LineNumber): $($_.Line.Trim())"
            }

      - name: Fix RakNet include
        shell: pwsh
        run: |
          $incdir = Get-ChildItem work -Recurse -Directory -Filter include |
            Select-Object -First 1

          if (-not $incdir) {
            Write-Host "ERROR: include directory not found"
            exit 1
          }

          $target = Join-Path $incdir.FullName "Pawn_RakNet.inc"

          if (-not (Test-Path $target)) {
            $source = Get-ChildItem work -Recurse -File -Filter Pawn.RakNet.inc |
              Select-Object -First 1

            if ($source) {
              Copy-Item $source.FullName $target
              Write-Host "RakNet include copied"
            }
          }

      - name: Diagnose invalid Pawn character constants
        shell: pwsh
        run: |
          $file = Get-ChildItem work -Recurse -File -Filter main.pwn |
            Select-Object -First 1

          if (-not $file) {
            throw "main.pwn not found"
          }

          $lines = [System.IO.File]::ReadAllLines($file.FullName)

          $targets = @(37970, 38016, 38095, 49498, 49516, 52094)

          foreach ($n in $targets) {
            Write-Host ""
            Write-Host "========== LINE $n =========="

            $start = [Math]::Max(1, $n - 3)
            $end = [Math]::Min($lines.Length, $n + 3)

            for ($i = $start; $i -le $end; $i++) {
              $line = $lines[$i - 1]
              $escaped = ConvertTo-Json -InputObject $line -Compress
              Write-Host "${i}: $escaped"
            }
          }

      - name: Compile main
        shell: pwsh
        run: |
          New-Item out -ItemType Directory -Force | Out-Null

          $pwn = Get-ChildItem work -Recurse -File -Filter main.pwn |
            Select-Object -First 1

          $compiler = Get-ChildItem work -Recurse -File -Filter pawncc.exe |
            Select-Object -First 1

          if (-not $pwn -or -not $compiler) {
            Write-Host "ERROR: main.pwn or pawncc.exe not found"
            exit 1
          }

          $opts = @("main.pwn", "-d3")

          Get-ChildItem work -Recurse -Directory -Filter include |
            ForEach-Object {
              $opts += ("-i" + $_.FullName)
            }

          $log = "$env:GITHUB_WORKSPACE\out\compile.log"

          Push-Location $pwn.DirectoryName
          try {
            & $compiler.FullName @opts *> $log
            $compileExit = $LASTEXITCODE
          }
          catch {
            $_ | Out-String | Out-File $log -Append
            $compileExit = 1
          }
          finally {
            Pop-Location
          }

          Write-Host "COMPILER EXIT CODE: $compileExit"

          if (Test-Path $log) {
            Get-Content $log -Tail 150
          }

          "Compiler exit code: $compileExit" |
            Out-File out\compiler_status.txt

          if ($compileExit -ne 0) {
            Write-Host "ERROR: compilation failed"
            exit 1
          }

          $amxPath = Join-Path $pwn.DirectoryName "main.amx"

          if (-not (Test-Path $amxPath)) {
            Write-Host "ERROR: main.amx was not generated"
            exit 1
          }

          $amx = Get-Item $amxPath

          Write-Host "AMX SIZE: $($amx.Length) bytes"

          if ($amx.Length -lt 1000000) {
            Write-Host "ERROR: AMX is suspiciously small"
            exit 1
          }

          Copy-Item $amxPath out\main.amx -Force

          Write-Host "Build validation passed."

      - name: Upload logs and AMX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-windows
          path: out/
          if-no-files-found: warn
