name: Compile Pawn
on:
  workflow_dispatch:
  push:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install runtimes
        shell: pwsh
        continue-on-error: true
        run: choco install vcredist2005 vcredist2008 vcredist2010 vcredist140 -y --no-progress
      - name: Unzip
        shell: pwsh
        run: Expand-Archive -Path src.zip -DestinationPath work -Force
      - name: Check includes
        shell: pwsh
        run: |
          $need = 'a_samp','crashdetect','log-plugin','a_mysql','fdialog','a_mail','streamer','pawncmd','sscanf2','foreach','strlib','Pawn_RakNet','time_t','timerfix','TOTP','bcrypt','player_geolocation','zvehcomp','voicechat','customhud','customtune','rustext','mapfix','color'
          $have = Get-ChildItem work -Recurse -Filter *.inc | ForEach-Object { $_.BaseName.ToLower() }
          $miss = $need | Where-Object { $have -notcontains $_.ToLower() }
          Write-Host "MISSING INCLUDES: $($miss -join ', ')"
          New-Item out -ItemType Directory -Force | Out-Null
          Get-ChildItem work -Recurse -Filter *.inc | Select-Object -ExpandProperty FullName | Out-File out\inc_list.txt
      - name: Compile
        shell: pwsh
        run: |
          $pwn = Get-ChildItem work -Recurse -Filter main.pwn | Sort-Object Length -Descending | Select-Object -First 1
          $cc = Get-ChildItem work -Recurse -Filter pawncc.exe | Select-Object -First 1
          $opts = @("main.pwn", "-d3")
          Get-ChildItem work -Recurse -Directory -Filter include | ForEach-Object { $opts += ("-i" + $_.FullName) }
          Push-Location $pwn.DirectoryName
          & $cc.FullName @opts *> "$env:GITHUB_WORKSPACE\out\compile.log"
          Write-Host "exit code: $LASTEXITCODE"
          Pop-Location
          Get-Content "$env:GITHUB_WORKSPACE\out\compile.log" -Tail 60
          if (Test-Path "$($pwn.DirectoryName)\main.amx") { Copy-Item "$($pwn.DirectoryName)\main.amx" out\; Write-Host "main.amx OK" }
          exit 0
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-windows
          path: out
