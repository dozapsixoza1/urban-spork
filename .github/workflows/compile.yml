name: Compile Pawn

on:
  workflow_dispatch:
  push:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source
        shell: pwsh
        run: |
          if (-not (Test-Path "src.zip")) {
            Write-Host "ERROR: src.zip not found in repository root"
            Get-ChildItem -Force | Select-Object Name
            exit 1
          }

          Expand-Archive -Path src.zip -DestinationPath work -Force
          New-Item out -ItemType Directory -Force | Out-Null
          Write-Host "Archive extracted."

      - name: Overlay root main.pwn when provided
        shell: pwsh
        run: |
          if (Test-Path "main.pwn") {
            $target = Get-ChildItem work -Recurse -File -Filter main.pwn |
              Sort-Object Length -Descending |
              Select-Object -First 1

            if (-not $target) {
              Write-Host "ERROR: main.pwn not found inside src.zip"
              exit 1
            }

            Copy-Item "main.pwn" $target.FullName -Force
            Write-Host "Updated source: $($target.FullName)"
          } else {
            Write-Host "WARNING: root main.pwn is missing."
            Write-Host "Using the source extracted from src.zip."
          }

      - name: Prepare compilers (src.zip + downloaded 3.10.10)
        shell: pwsh
        run: |
          $ws = $env:GITHUB_WORKSPACE

          function Test-Mz($exe) {
            $b = [System.IO.File]::ReadAllBytes($exe)
            return ($b.Length -ge 2 -and $b[0] -eq 0x4D -and $b[1] -eq 0x5A)
          }

          # --- компилятор из src.zip ---
          $zipDir = Join-Path $ws "compiler_zip"
          if (Test-Path $zipDir) { Remove-Item $zipDir -Recurse -Force }

          $zipCompiler = Get-ChildItem work -Recurse -File -Filter pawncc.exe |
            Select-Object -First 1

          if ($zipCompiler) {
            New-Item -ItemType Directory -Force -Path $zipDir | Out-Null
            Get-ChildItem $zipCompiler.DirectoryName -File |
              Where-Object { $_.Extension -in @(".exe", ".dll") } |
              ForEach-Object { Copy-Item $_.FullName $zipDir -Force }
            Write-Host "Compiler from src.zip:"
            Get-ChildItem $zipDir | Select-Object Name, Length
            if (-not (Test-Mz (Join-Path $zipDir "pawncc.exe"))) {
              Write-Host "WARNING: src.zip pawncc.exe has no MZ header, skipping it"
              Remove-Item $zipDir -Recurse -Force
            }
          } else {
            Write-Host "pawncc.exe not found in src.zip"
          }

          # --- скачанный 3.10.10 ---
          $dlDir = Join-Path $ws "compiler_dl"
          if (Test-Path $dlDir) { Remove-Item $dlDir -Recurse -Force }

          try {
            New-Item -ItemType Directory -Force -Path $dlDir | Out-Null
            $url = "https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-windows.zip"
            $zipPath = Join-Path $env:TEMP "pawnc.zip"
            Invoke-WebRequest -Uri $url -OutFile $zipPath

            $extractedTemp = Join-Path $env:TEMP "pawnc_extracted"
            if (Test-Path $extractedTemp) { Remove-Item $extractedTemp -Recurse -Force }
            Expand-Archive -Path $zipPath -DestinationPath $extractedTemp -Force

            Get-ChildItem $extractedTemp -Recurse -File |
              Where-Object { $_.Extension -in @(".exe", ".dll") } |
              ForEach-Object { Copy-Item $_.FullName $dlDir -Force }

            Write-Host "Downloaded compiler 3.10.10:"
            Get-ChildItem $dlDir | Select-Object Name, Length

            if (-not (Test-Mz (Join-Path $dlDir "pawncc.exe"))) {
              Write-Host "WARNING: downloaded pawncc.exe has no MZ header, skipping it"
              Remove-Item $dlDir -Recurse -Force
            }
          } catch {
            Write-Host "WARNING: failed to download pawn compiler: $_"
            if (Test-Path $dlDir) { Remove-Item $dlDir -Recurse -Force }
          }

          if (-not (Test-Path $zipDir) -and -not (Test-Path $dlDir)) {
            Write-Host "ERROR: no usable compiler found"
            exit 1
          }

      - name: Remove Ctrl-Z bytes from Pawn sources
        shell: pwsh
        run: |
          $files = Get-ChildItem work -Recurse -File |
            Where-Object { $_.Extension -in @(".pwn", ".inc") }

          $total = 0

          foreach ($file in $files) {
            $bytes = [IO.File]::ReadAllBytes($file.FullName)

            if ($bytes -contains 26) {
              $clean = [Collections.Generic.List[byte]]::new()

              foreach ($b in $bytes) {
                if ($b -eq 26) {
                  $total++
                } else {
                  $clean.Add($b)
                }
              }

              [IO.File]::WriteAllBytes(
                $file.FullName,
                $clean.ToArray()
              )

              Write-Host "Removed Ctrl-Z bytes from $($file.FullName)"
            }
          }

          "Removed Ctrl-Z bytes: $total" |
            Set-Content out\source_bytes.txt

          Write-Host "TOTAL Ctrl-Z bytes removed: $total"

      - name: Fix RakNet include filename if needed
        shell: pwsh
        run: |
          $target = Get-ChildItem work -Recurse -File -Filter Pawn_RakNet.inc

          if (-not $target) {
            $source = Get-ChildItem work -Recurse -File |
              Where-Object { $_.Name -ieq "Pawn.RakNet.inc" } |
              Select-Object -First 1

            $includeDir = Get-ChildItem work -Recurse -Directory -Filter include |
              Select-Object -First 1

            if ($source -and $includeDir) {
              Copy-Item $source.FullName `
                (Join-Path $includeDir.FullName "Pawn_RakNet.inc") -Force

              Write-Host "Copied alternate RakNet include filename."
            } else {
              Write-Host "No alternate RakNet include found."
            }
          }

      - name: Install Visual C++ 2010 Runtime
        shell: pwsh
        run: |
          Write-Host "Checking Visual C++ 2010 runtime..."

          if (-not (
            (Test-Path "$env:WINDIR\SysWOW64\MSVCR100.dll") -or
            (Test-Path "$env:WINDIR\System32\MSVCR100.dll")
          )) {
            choco install vcredist2010 -y --no-progress
            Write-Host "Chocolatey exit code: $LASTEXITCODE"
          }

      - name: Compile main (try several compiler variants)
        shell: pwsh
        run: |
          $ws = $env:GITHUB_WORKSPACE

          $pwn = Get-ChildItem work -Recurse -File -Filter main.pwn |
            Sort-Object Length -Descending |
            Select-Object -First 1

          if (-not $pwn) {
            Write-Host "ERROR: main.pwn not found"
            exit 1
          }

          $includeDirs = Get-ChildItem work -Recurse -Directory -Filter include

          $argsList = @($pwn.FullName)
          foreach ($inc in $includeDirs) {
            $argsList += "-i$($inc.FullName)"
          }

          Write-Host "SOURCE: $($pwn.FullName)"
          Write-Host "SOURCE SIZE: $($pwn.Length)"
          Write-Host "INCLUDE DIRECTORIES: $($includeDirs.Count)"

          $amxPath = Join-Path $pwn.DirectoryName "main.amx"
          $summary = Join-Path $ws "out\summary.txt"
          "" | Set-Content $summary

          function Set-Laa($exe) {
            $bytes = [System.IO.File]::ReadAllBytes($exe)
            $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3C)
            $charOffset = $peOffset + 22
            [uint16]$chars = [System.BitConverter]::ToUInt16($bytes, $charOffset)
            if (($chars -band 0x0020) -eq 0) {
              [uint16]$newChars = $chars -bor 0x0020
              $patch = [System.BitConverter]::GetBytes($newChars)
              $bytes[$charOffset]     = $patch[0]
              $bytes[$charOffset + 1] = $patch[1]
              [System.IO.File]::WriteAllBytes($exe, $bytes)
            }
          }

          function Invoke-Pawn($dir, $label) {
            $exe = Join-Path $dir "pawncc.exe"
            $log = Join-Path $ws "out\compile_$label.log"

            if (Test-Path $amxPath) { Remove-Item $amxPath -Force }

            $code = 1
            try {
              $psi = New-Object System.Diagnostics.ProcessStartInfo
              $psi.FileName = $exe
              $psi.Arguments = [string]::Join(" ", ($argsList | ForEach-Object { "`"$_`"" }))
              $psi.WorkingDirectory = $pwn.DirectoryName
              $psi.RedirectStandardOutput = $true
              $psi.RedirectStandardError = $true
              $psi.UseShellExecute = $false
              $psi.CreateNoWindow = $true

              $p = New-Object System.Diagnostics.Process
              $p.StartInfo = $psi
              [void]$p.Start()

              $stdOut = $p.StandardOutput.ReadToEnd()
              $stdErr = $p.StandardError.ReadToEnd()
              $p.WaitForExit()

              $code = $p.ExitCode
              ($stdOut + "`n" + $stdErr) | Set-Content $log -Encoding UTF8
            } catch {
              $_ | Out-String | Set-Content $log
              $code = 1
            }

            return $code
          }

          # собираем список вариантов
          $variants = @()

          $zipDir = Join-Path $ws "compiler_zip"
          if (Test-Path $zipDir) {
            $variants += @{ Label = "zip_noLAA"; Dir = $zipDir }
            $zipLaa = Join-Path $ws "compiler_zip_laa"
            if (Test-Path $zipLaa) { Remove-Item $zipLaa -Recurse -Force }
            Copy-Item $zipDir $zipLaa -Recurse
            Set-Laa (Join-Path $zipLaa "pawncc.exe")
            $variants += @{ Label = "zip_LAA"; Dir = $zipLaa }
          }

          $dlDir = Join-Path $ws "compiler_dl"
          if (Test-Path $dlDir) {
            $variants += @{ Label = "dl_noLAA"; Dir = $dlDir }
            $dlLaa = Join-Path $ws "compiler_dl_laa"
            if (Test-Path $dlLaa) { Remove-Item $dlLaa -Recurse -Force }
            Copy-Item $dlDir $dlLaa -Recurse
            Set-Laa (Join-Path $dlLaa "pawncc.exe")
            $variants += @{ Label = "dl_LAA"; Dir = $dlLaa }
          }

          $success = $false

          foreach ($v in $variants) {
            Write-Host ""
            Write-Host "=== TRY: $($v.Label) ==="
            $code = Invoke-Pawn $v.Dir $v.Label
            Write-Host "EXIT CODE: $code"

            $log = Join-Path $ws "out\compile_$($v.Label).log"
            if (Test-Path $log) { Get-Content $log -Tail 100 }

            $amxOk = $false
            if (Test-Path $amxPath) {
              $amx = Get-Item $amxPath
              Write-Host "AMX SIZE: $($amx.Length) bytes"
              if ($amx.Length -ge 1000000) { $amxOk = $true }
            }

            "$($v.Label): exit=$code amx_ok=$amxOk" | Add-Content $summary

            if ($code -eq 0 -and $amxOk) {
              Copy-Item $amxPath (Join-Path $ws "out\main.amx") -Force
              "WINNER: $($v.Label)" | Add-Content $summary
              Write-Host "BUILD OK with $($v.Label)"
              $success = $true
              break
            }
          }

          Write-Host ""
          Write-Host "=== SUMMARY ==="
          Get-Content $summary

          if (-not $success) {
            Write-Host "ERROR: all compiler variants failed"
            exit 1
          }

      - name: Upload logs and AMX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-windows
          path: out/
          if-no-files-found: warn
