name: Compile Pawn

on:
  workflow_dispatch:
  push:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install runtimes
        shell: pwsh
        continue-on-error: true
        run: |
          choco install vcredist2005 vcredist2008 vcredist2010 vcredist140 -y --no-progress

      - name: Extract source
        shell: pwsh
        run: |
          Expand-Archive -Path src.zip -DestinationPath work -Force

      - name: Fix RakNet include
        shell: pwsh
        run: |
          $incdir = Get-ChildItem work -Recurse -Directory -Filter include |
            Select-Object -First 1

          $target = Join-Path $incdir.FullName "Pawn_RakNet.inc"

          if (-not (Test-Path $target)) {
            $source = Get-ChildItem work -Recurse -Filter Pawn.RakNet.inc |
              Select-Object -First 1

            if ($source) {
              Copy-Item $source.FullName $target
              Write-Host "RakNet include copied"
            }
          }

      - name: Diagnose Pawn CMD aliases
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          New-Item out -ItemType Directory -Force | Out-Null

          $pwn = Get-ChildItem work -Recurse -Filter main.pwn |
            Select-Object -First 1

          $compiler = Get-ChildItem work -Recurse -Filter pawncc.exe |
            Select-Object -First 1

          if (-not $pwn -or -not $compiler) {
            Write-Host "ERROR: main.pwn or pawncc.exe not found"
            exit 1
          }

          Write-Host "MAIN: $($pwn.FullName)"
          Write-Host "COMPILER: $($compiler.FullName)"

          Write-Host "`n========== MAIN INCLUDES =========="

          Select-String -Path $pwn.FullName `
            -Pattern '^\s*#\s*include' |
            ForEach-Object {
              Write-Host "$($_.LineNumber): $($_.Line.Trim())"
            }

          Write-Host "`n========== ALIAS DEFINITIONS AND UNDEFINES =========="

          Get-ChildItem work -Recurse -File |
            Where-Object { $_.Extension -in @(".pwn", ".inc") } |
            Select-String -Pattern '^\s*#\s*(define|undef|if|elseif|ifdef|ifndef).*alias|^\s*#\s*define\s+(cmd|CMD|COMMAND)' |
            ForEach-Object {
              Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())"
            }

          Write-Host "`n========== PAWN CMD FILES =========="

          $cmdFiles = Get-ChildItem work -Recurse -File |
            Where-Object {
              $_.Name -match '^(pawn.?cmd|zcmd)\.inc$'
            }

          foreach ($file in $cmdFiles) {
            Write-Host "`nFILE: $($file.FullName)"

            $lines = Get-Content $file.FullName
            $start = 60
            $end = [Math]::Min(95, $lines.Count)

            for ($i = $start; $i -le $end; $i++) {
              Write-Host ("{0}: {1}" -f $i, $lines[$i - 1])
            }
          }

          Write-Host "`n========== CREATE ALIAS PROBE =========="

          $probe = @'
          #include <a_samp>
          #include <pawncmd>

          CMD:aliasprobe(playerid, params[])
          {
              return 1;
          }
          alias:aliasprobe("aprobe");
          '@

          $probePath = Join-Path $pwn.DirectoryName "alias_probe.pwn"
          Set-Content -Path $probePath -Value $probe

          $probeLog = Join-Path $env:GITHUB_WORKSPACE "out\alias_probe.log"

          $includeArgs = @()
          Get-ChildItem work -Recurse -Directory -Filter include |
            ForEach-Object {
              $includeArgs += ("-i" + $_.FullName)
            }

          Push-Location $pwn.DirectoryName

          try {
            & $compiler.FullName @includeArgs "alias_probe.pwn" "-d3" *> $probeLog
            $probeExit = $LASTEXITCODE
          }
          catch {
            $_ | Out-String | Out-File $probeLog -Append
            $probeExit = 1
          }
          finally {
            Pop-Location
          }

          Write-Host "ALIAS PROBE EXIT CODE: $probeExit"
          Get-Content $probeLog

          "Alias probe exit code: $probeExit" |
            Out-File out\alias_probe_status.txt

      - name: Compile main
        shell: pwsh
        run: |
          New-Item out -ItemType Directory -Force | Out-Null

          $pwn = Get-ChildItem work -Recurse -Filter main.pwn |
            Select-Object -First 1

          $compiler = Get-ChildItem work -Recurse -Filter pawncc.exe |
            Select-Object -First 1

          if (-not $pwn -or -not $compiler) {
            Write-Host "ERROR: main.pwn or pawncc.exe not found"
            exit 1
          }

          $opts = @("main.pwn", "-d3")

          Get-ChildItem work -Recurse -Directory -Filter include |
            ForEach-Object {
              $opts += ("-i" + $_.FullName)
            }

          Push-Location $pwn.DirectoryName

          try {
            & $compiler.FullName @opts *> "$env:GITHUB_WORKSPACE\out\compile.log"
            $compileExit = $LASTEXITCODE
          }
          catch {
            $_ | Out-String |
              Out-File "$env:GITHUB_WORKSPACE\out\compile.log" -Append
            $compileExit = 1
          }
          finally {
            Pop-Location
          }

          Write-Host "COMPILER EXIT CODE: $compileExit"

          if (Test-Path "$($pwn.DirectoryName)\main.amx") {
            Copy-Item "$($pwn.DirectoryName)\main.amx" out\main.amx -Force
            Write-Host "main.amx created"
          }
          else {
            Write-Host "main.amx not generated"
          }

          Get-Content out\compile.log -Tail 100

          "Compiler exit code: $compileExit" |
            Out-File out\compiler_status.txt

          if ($compileExit -ne 0) {
            exit $compileExit
          }

          if (-not (Test-Path out\main.amx)) {
            Write-Host "ERROR: main.amx missing"
            exit 1
          }

      - name: Upload logs and AMX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-windows
          path: out/
          if-no-files-found: warn
