name: Compile Pawn

on:
  workflow_dispatch:
  push:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source
        shell: pwsh
        run: |
          if (-not (Test-Path "src.zip")) {
            Write-Host "ERROR: src.zip not found"
            exit 1
          }

          Expand-Archive -Path src.zip -DestinationPath work -Force
          New-Item out -ItemType Directory -Force | Out-Null

          Write-Host "Source archive extracted."

      - name: Locate Pawn compiler
        shell: pwsh
        run: |
          $pwn = Get-ChildItem work -Recurse -File -Filter main.pwn |
            Select-Object -First 1

          if (-not $pwn) {
            Write-Host "ERROR: main.pwn not found"
            exit 1
          }

          $preferred = Join-Path $pwn.DirectoryName "pawncc.exe"

          if (Test-Path $preferred) {
            $compiler = Get-Item $preferred
          } else {
            $compiler = Get-ChildItem work -Recurse -File -Filter pawncc.exe |
              Select-Object -First 1
          }

          if (-not $compiler) {
            Write-Host "ERROR: pawncc.exe not found"
            exit 1
          }

          "SOURCE=$($pwn.FullName)" |
            Set-Content out\paths.txt

          "COMPILER=$($compiler.FullName)" |
            Add-Content out\paths.txt

          Write-Host "SOURCE: $($pwn.FullName)"
          Write-Host "COMPILER: $($compiler.FullName)"
          Write-Host "COMPILER SIZE: $($compiler.Length) bytes"

      - name: Remove Ctrl-Z bytes
        shell: pwsh
        run: |
          $files = Get-ChildItem work -Recurse -File |
            Where-Object {
              $_.Extension -in @(".pwn", ".inc")
            }

          $total = 0

          foreach ($file in $files) {
            $bytes = [IO.File]::ReadAllBytes($file.FullName)

            if ($bytes -contains 26) {
              $clean = [Collections.Generic.List[byte]]::new()

              foreach ($b in $bytes) {
                if ($b -ne 26) {
                  $clean.Add($b)
                } else {
                  $total++
                }
              }

              [IO.File]::WriteAllBytes(
                $file.FullName,
                $clean.ToArray()
              )

              Write-Host "Cleaned: $($file.FullName)"
            }
          }

          Write-Host "Removed Ctrl-Z bytes: $total"

          "Removed Ctrl-Z bytes: $total" |
            Set-Content out\source_bytes.txt

      - name: Install Visual C++ 2010 Runtime
        shell: pwsh
        run: |
          Write-Host "Installing the x86 Visual C++ 2010 runtime..."

          choco install vcredist2010 -y --no-progress

          if ($LASTEXITCODE -ne 0) {
            Write-Host "Chocolatey installation returned: $LASTEXITCODE"
            Write-Host "Will continue to DLL diagnostics."
          }

          Write-Host "Checking for MSVCR100.dll..."

          $runtimeLocations = @(
            "$env:WINDIR\SysWOW64\MSVCR100.dll",
            "$env:WINDIR\System32\MSVCR100.dll"
          )

          foreach ($path in $runtimeLocations) {
            Write-Host "$path : $(Test-Path $path)"
          }

      - name: Prepare compiler DLLs
        shell: pwsh
        run: |
          $pwn = Get-ChildItem work -Recurse -File -Filter main.pwn |
            Select-Object -First 1

          if (-not $pwn) {
            Write-Host "ERROR: main.pwn not found"
            exit 1
          }

          $compilerPath = Join-Path $pwn.DirectoryName "pawncc.exe"

          if (Test-Path $compilerPath) {
            $compiler = Get-Item $compilerPath
          } else {
            $compiler = Get-ChildItem work -Recurse -File -Filter pawncc.exe |
              Select-Object -First 1
          }

          if (-not $compiler) {
            Write-Host "ERROR: pawncc.exe not found"
            exit 1
          }

          $compilerDir = $compiler.DirectoryName

          $dlls = Get-ChildItem work -Recurse -File -Filter "*.dll"

          Write-Host "DLL files in archive: $($dlls.Count)"

          foreach ($dll in $dlls) {
            Write-Host "DLL: $($dll.FullName)"

            $destination = Join-Path $compilerDir $dll.Name

            if (-not (Test-Path $destination)) {
              Copy-Item $dll.FullName $destination -Force
              Write-Host "Copied beside compiler: $($dll.Name)"
            }
          }

          $dllDirs = Get-ChildItem work -Recurse -File -Filter "*.dll" |
            ForEach-Object { $_.DirectoryName } |
            Sort-Object -Unique

          $env:PATH = (
            ($dllDirs -join ";") +
            ";" +
            $compilerDir +
            ";" +
            $env:PATH
          )

          $env:PATH | Set-Content out\dll_search_path.txt

          Write-Host "Compiler directory: $compilerDir"

          Write-Host "DLLs beside compiler:"
          Get-ChildItem $compilerDir -File -Filter "*.dll" |
            ForEach-Object {
              Write-Host "$($_.Name) ($($_.Length) bytes)"
            }

      - name: Diagnose compiler dependencies
        shell: pwsh
        run: |
          $pwn = Get-ChildItem work -Recurse -File -Filter main.pwn |
            Select-Object -First 1

          $compilerPath = Join-Path $pwn.DirectoryName "pawncc.exe"

          if (Test-Path $compilerPath) {
            $compiler = Get-Item $compilerPath
          } else {
            $compiler = Get-ChildItem work -Recurse -File -Filter pawncc.exe |
              Select-Object -First 1
          }

          $names = @(
            "KERNEL32.dll",
            "MSVCR100.dll",
            "PAWNC.dll"
          )

          $report = @()

          foreach ($name in $names) {
            Write-Host "Checking $name"

            $locations = @(
              (Join-Path $compiler.DirectoryName $name),
              (Join-Path "$env:WINDIR\SysWOW64" $name),
              (Join-Path "$env:WINDIR\System32" $name)
            )

            $locations += @(
              Get-ChildItem work -Recurse -File -Filter $name |
                ForEach-Object { $_.FullName }
            )

            $found = $false

            foreach ($location in ($locations | Select-Object -Unique)) {
              if (Test-Path $location) {
                Write-Host "FOUND: $location"
                $report += "$name FOUND: $location"
                $found = $true
              }
            }

            if (-not $found) {
              Write-Host "MISSING: $name"
              $report += "$name MISSING"
            }
          }

          $report | Set-Content out\compiler_diagnostics.txt

          Write-Host "Testing whether the compiler can start..."

          Push-Location $compiler.DirectoryName

          try {
            & $compiler.FullName 2>&1 |
              Tee-Object -FilePath "$env:GITHUB_WORKSPACE\out\compiler_test.log"

            $testExit = $LASTEXITCODE
          } catch {
            Write-Host $_
            $testExit = 1
          } finally {
            Pop-Location
          }

          Write-Host "Compiler test exit code: $testExit"

          "Compiler test exit code: $testExit" |
            Add-Content out\compiler_diagnostics.txt

      - name: Compile main
        shell: pwsh
        run: |
          $pwn = Get-ChildItem work -Recurse -File -Filter main.pwn |
            Select-Object -First 1

          if (-not $pwn) {
            Write-Host "ERROR: main.pwn not found"
            exit 1
          }

          $compilerPath = Join-Path $pwn.DirectoryName "pawncc.exe"

          if (Test-Path $compilerPath) {
            $compiler = Get-Item $compilerPath
          } else {
            $compiler = Get-ChildItem work -Recurse -File -Filter pawncc.exe |
              Select-Object -First 1
          }

          if (-not $compiler) {
            Write-Host "ERROR: pawncc.exe not found"
            exit 1
          }

          $dllDirs = Get-ChildItem work -Recurse -File -Filter "*.dll" |
            ForEach-Object { $_.DirectoryName } |
            Sort-Object -Unique

          $env:PATH = (
            ($dllDirs -join ";") +
            ";" +
            $compiler.DirectoryName +
            ";" +
            $env:PATH
          )

          $includes = Get-ChildItem work -Recurse -Directory -Filter include

          $argsList = @(
            $pwn.FullName,
            "-d3"
          )

          foreach ($inc in $includes) {
            $argsList += "-i$($inc.FullName)"
          }

          $log = Join-Path $env:GITHUB_WORKSPACE "out\compile.log"

          Write-Host "COMPILING SOURCE: $($pwn.FullName)"
          Write-Host "USING COMPILER: $($compiler.FullName)"
          Write-Host "INCLUDE DIRECTORIES: $($includes.Count)"

          Push-Location $compiler.DirectoryName

          try {
            & $compiler.FullName @argsList *> $log
            $compileExit = $LASTEXITCODE
          } catch {
            $_ | Out-String | Add-Content $log
            $compileExit = 1
          } finally {
            Pop-Location
          }

          Write-Host "COMPILER EXIT CODE: $compileExit"

          if (Test-Path $log) {
            Get-Content $log -Tail 250
          }

          "Compiler exit code: $compileExit" |
            Set-Content out\compiler_status.txt

          if ($compileExit -ne 0) {
            Write-Host "ERROR: Pawn compilation failed."
            exit 1
          }

          $amxPath = Join-Path $pwn.DirectoryName "main.amx"

          if (-not (Test-Path $amxPath)) {
            Write-Host "ERROR: main.amx was not generated"
            exit 1
          }

          $amx = Get-Item $amxPath

          Write-Host "AMX SIZE: $($amx.Length) bytes"

          if ($amx.Length -lt 1000000) {
            Write-Host "ERROR: AMX file is suspiciously small."
            Write-Host "Refusing to publish it."
            exit 1
          }

          Copy-Item $amxPath "out\main.amx" -Force

          Write-Host "SUCCESS: main.amx copied to out."

      - name: Upload diagnostics and compiled AMX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-windows
          path: out/
          if-no-files-found: warn
