name: Compile Pawn

on:
  workflow_dispatch:
  push:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source
        shell: pwsh
        run: |
          if (-not (Test-Path "src.zip")) {
            Write-Host "ERROR: src.zip not found"
            exit 1
          }

          Expand-Archive -Path src.zip -DestinationPath work -Force
          New-Item out -ItemType Directory -Force | Out-Null
          Write-Host "Archive extracted."

      - name: Locate Pawn source and compiler
        shell: pwsh
        run: |
          $pwn = Get-ChildItem work -Recurse -File -Filter main.pwn |
            Select-Object -First 1

          if (-not $pwn) {
            Write-Host "ERROR: main.pwn not found"
            exit 1
          }

          $preferred = Join-Path $pwn.DirectoryName 'pawncc.exe'

          if (Test-Path $preferred) {
            $compiler = Get-Item $preferred
          } else {
            $compiler = Get-ChildItem work -Recurse -File -Filter pawncc.exe |
              Select-Object -First 1
          }

          if (-not $compiler) {
            Write-Host "ERROR: pawncc.exe not found"
            exit 1
          }

          Write-Host "SOURCE: $($pwn.FullName)"
          Write-Host "SOURCE SIZE: $($pwn.Length) bytes"
          Write-Host "COMPILER: $($compiler.FullName)"

          "SOURCE=$($pwn.FullName)" | Set-Content out\paths.txt
          "COMPILER=$($compiler.FullName)" | Add-Content out\paths.txt

      - name: Remove Ctrl-Z bytes from Pawn sources
        shell: pwsh
        run: |
          $files = Get-ChildItem work -Recurse -File |
            Where-Object { $_.Extension -in @('.pwn', '.inc') }

          $total = 0

          foreach ($file in $files) {
            $bytes = [IO.File]::ReadAllBytes($file.FullName)

            if ($bytes -contains 26) {
              $clean = [Collections.Generic.List[byte]]::new()

              foreach ($b in $bytes) {
                if ($b -eq 26) {
                  $total++
                } else {
                  $clean.Add($b)
                }
              }

              [IO.File]::WriteAllBytes(
                $file.FullName,
                $clean.ToArray()
              )

              Write-Host "Removed Ctrl-Z bytes from $($file.FullName)"
            }
          }

          "Removed Ctrl-Z bytes: $total" |
            Set-Content out\source_bytes.txt

          Write-Host "TOTAL Ctrl-Z bytes removed: $total"

      - name: Fix RakNet include filename if needed
        shell: pwsh
        run: |
          $target = Get-ChildItem work -Recurse -File -Filter Pawn_RakNet.inc

          if (-not $target) {
            $source = Get-ChildItem work -Recurse -File |
              Where-Object { $_.Name -ieq 'Pawn.RakNet.inc' } |
              Select-Object -First 1

            $includeDir = Get-ChildItem work -Recurse -Directory -Filter include |
              Select-Object -First 1

            if ($source -and $includeDir) {
              Copy-Item $source.FullName `
                (Join-Path $includeDir.FullName 'Pawn_RakNet.inc') -Force

              Write-Host "Copied alternate RakNet include filename."
            } else {
              Write-Host "No alternate RakNet include found; continuing."
            }
          }

      - name: Install Visual C++ 2010 Runtime
        shell: pwsh
        run: |
          Write-Host "Installing Visual C++ 2010 runtime..."

          choco install vcredist2010 -y --no-progress

          $chocoExit = $LASTEXITCODE
          Write-Host "Chocolatey exit code: $chocoExit"

          foreach ($path in @(
            "$env:WINDIR\SysWOW64\MSVCR100.dll",
            "$env:WINDIR\System32\MSVCR100.dll"
          )) {
            Write-Host "$path : $(Test-Path $path)"
          }

          exit 0

      - name: Prepare compiler DLL dependencies
        shell: pwsh
        run: |
          $pwn = Get-ChildItem work -Recurse -File -Filter main.pwn |
            Select-Object -First 1

          if (-not $pwn) {
            Write-Host "ERROR: main.pwn not found"
            exit 1
          }

          $preferred = Join-Path $pwn.DirectoryName 'pawncc.exe'

          if (Test-Path $preferred) {
            $compiler = Get-Item $preferred
          } else {
            $compiler = Get-ChildItem work -Recurse -File -Filter pawncc.exe |
              Select-Object -First 1
          }

          if (-not $compiler) {
            Write-Host "ERROR: pawncc.exe not found"
            exit 1
          }

          $compilerDir = $compiler.DirectoryName

          $dllFiles = Get-ChildItem work -Recurse -File -Filter '*.dll'
          $dllDirs = $dllFiles |
            ForEach-Object { $_.DirectoryName } |
            Sort-Object -Unique

          $env:PATH = (
            ($dllDirs -join ';') +
            ';' +
            $compilerDir +
            ';' +
            $env:PATH
          )

          $env:PATH | Set-Content out\dll_search_path.txt

          foreach ($dll in $dllFiles) {
            $destination = Join-Path $compilerDir $dll.Name

            if (-not (Test-Path $destination)) {
              Copy-Item $dll.FullName $destination -Force
              Write-Host "Copied DLL beside compiler: $($dll.Name)"
            }
          }

          Write-Host "Compiler: $($compiler.FullName)"
          Write-Host "DLL files found: $($dllFiles.Count)"

          Get-ChildItem $compilerDir -File -Filter '*.dll' |
            ForEach-Object {
              Write-Host "$($_.Name) ($($_.Length) bytes)"
            }

      - name: Diagnose compiler dependencies
        shell: pwsh
        run: |
          $pwn = Get-ChildItem work -Recurse -File -Filter main.pwn |
            Select-Object -First 1

          if (-not $pwn) {
            Write-Host "ERROR: main.pwn not found"
            exit 1
          }

          $preferred = Join-Path $pwn.DirectoryName 'pawncc.exe'

          if (Test-Path $preferred) {
            $compiler = Get-Item $preferred
          } else {
            $compiler = Get-ChildItem work -Recurse -File -Filter pawncc.exe |
              Select-Object -First 1
          }

          if (-not $compiler) {
            Write-Host "ERROR: pawncc.exe not found"
            exit 1
          }

          $names = @(
            'KERNEL32.dll',
            'MSVCR100.dll',
            'PAWNC.dll'
          )

          $report = @("Selected compiler: $($compiler.FullName)")

          foreach ($name in $names) {
            $locations = @()

            $locations += Get-ChildItem $compiler.DirectoryName -File -Filter $name `
              -ErrorAction SilentlyContinue |
              ForEach-Object FullName

            $locations += Get-ChildItem work -Recurse -File -Filter $name `
              -ErrorAction SilentlyContinue |
              ForEach-Object FullName

            $locations += Get-ChildItem "$env:WINDIR\SysWOW64" -File -Filter $name `
              -ErrorAction SilentlyContinue |
              ForEach-Object FullName

            $locations += Get-ChildItem "$env:WINDIR\System32" -File -Filter $name `
              -ErrorAction SilentlyContinue |
              ForEach-Object FullName

            $locations = $locations | Sort-Object -Unique

            if ($locations) {
              foreach ($location in $locations) {
                Write-Host "FOUND $name : $location"
                $report += "FOUND $name : $location"
              }
            } else {
              Write-Host "MISSING $name"
              $report += "MISSING $name"
            }
          }

          Write-Host "Testing compiler startup..."

          Push-Location $compiler.DirectoryName

          try {
            & $compiler.FullName 2>&1 |
              Tee-Object -FilePath "$env:GITHUB_WORKSPACE\out\compiler_test.log"

            $testExit = $LASTEXITCODE
          } catch {
            Write-Host $_
            $testExit = 1
          } finally {
            Pop-Location
          }

          Write-Host "Compiler startup test exit code: $testExit"

          $report += "Compiler startup test exit code: $testExit"
          $report | Set-Content out\compiler_diagnostics.txt

          # Код 3 ожидаем, когда pawncc.exe запускается без исходника.
          # Это проверка запуска, а не компиляция проекта.
          $global:LASTEXITCODE = 0
          exit 0

      - name: Compile main
        shell: pwsh
        run: |
          $pwn = Get-ChildItem work -Recurse -File -Filter main.pwn |
            Select-Object -First 1

          if (-not $pwn) {
            Write-Host "ERROR: main.pwn not found"
            exit 1
          }

          $preferred = Join-Path $pwn.DirectoryName 'pawncc.exe'

          if (Test-Path $preferred) {
            $compiler = Get-Item $preferred
          } else {
            $compiler = Get-ChildItem work -Recurse -File -Filter pawncc.exe |
              Select-Object -First 1
          }

          if (-not $compiler) {
            Write-Host "ERROR: pawncc.exe not found"
            exit 1
          }

          $dllDirs = Get-ChildItem work -Recurse -File -Filter '*.dll' |
            ForEach-Object { $_.DirectoryName } |
            Sort-Object -Unique

          $env:PATH = (
            ($dllDirs -join ';') +
            ';' +
            $compiler.DirectoryName +
            ';' +
            $env:PATH
          )

          $includeDirs = Get-ChildItem work -Recurse -Directory -Filter include
          $argsList = @($pwn.FullName, '-d3')

          foreach ($inc in $includeDirs) {
            $argsList += "-i$($inc.FullName)"
          }

          $log = Join-Path $env:GITHUB_WORKSPACE 'out\compile.log'

          Write-Host "COMPILING SOURCE: $($pwn.FullName)"
          Write-Host "USING COMPILER: $($compiler.FullName)"
          Write-Host "INCLUDE DIRECTORIES: $($includeDirs.Count)"
          Write-Host "DLL DIRECTORIES: $($dllDirs.Count)"

          Push-Location $compiler.DirectoryName

          try {
            & $compiler.FullName @argsList *> $log
            $compileExit = $LASTEXITCODE
          } catch {
            $_ | Out-String | Add-Content $log
            $compileExit = 1
          } finally {
            Pop-Location
          }

          Write-Host "COMPILER EXIT CODE: $compileExit"

          if (Test-Path $log) {
            Get-Content $log -Tail 300
          }

          "Compiler exit code: $compileExit" |
            Set-Content out\compiler_status.txt

          if ($compileExit -ne 0) {
            Write-Host "ERROR: Pawn compilation failed."
            exit 1
          }

          $amxPath = Join-Path $pwn.DirectoryName 'main.amx'

          if (-not (Test-Path $amxPath)) {
            Write-Host "ERROR: main.amx was not generated"
            exit 1
          }

          $amx = Get-Item $amxPath
          Write-Host "GENERATED AMX SIZE: $($amx.Length) bytes"

          if ($amx.Length -lt 1000000) {
            Write-Host "ERROR: AMX is suspiciously small; refusing to publish it."
            exit 1
          }

          Copy-Item $amxPath 'out\main.amx' -Force
          Write-Host "SUCCESS: copied main.amx to out\main.amx"

      - name: Upload logs and AMX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-windows
          path: out/
          if-no-files-found: warn
