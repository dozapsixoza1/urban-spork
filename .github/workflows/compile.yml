name: Compile Pawn

on:
  workflow_dispatch:
  push:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source
        shell: pwsh
        run: |
          if (-not (Test-Path "src.zip")) {
            Write-Host "ERROR: src.zip not found in repository root"
            Get-ChildItem -Force | Select-Object Name
            exit 1
          }

          Expand-Archive -Path src.zip -DestinationPath work -Force
          New-Item out -ItemType Directory -Force | Out-Null
          Write-Host "Archive extracted."

      - name: Overlay root main.pwn when provided
        shell: pwsh
        run: |
          if (Test-Path "main.pwn") {
            $target = Get-ChildItem work -Recurse -File -Filter main.pwn |
              Sort-Object Length -Descending |
              Select-Object -First 1

            if (-not $target) {
              Write-Host "ERROR: main.pwn not found inside src.zip"
              exit 1
            }

            Copy-Item "main.pwn" $target.FullName -Force
            Write-Host "Updated source: $($target.FullName)"
          } else {
            Write-Host "WARNING: root main.pwn is missing."
            Write-Host "Using the source extracted from src.zip."
          }

      - name: Download and Install Official Open.MP Compiler
        shell: pwsh
        run: |
          $pwn = Get-ChildItem work -Recurse -File -Filter main.pwn | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $pwn) {
            Write-Host "ERROR: main.pwn not found"
            exit 1
          }
          $compilerDir = $pwn.DirectoryName

          Write-Host "Fetching latest pawn compiler release info from open.mp..."
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/openmultiplayer/compiler/releases/latest" -Headers @{ "User-Agent" = "PowerShell" }
          $asset = $release.assets | Where-Object { $_.name -like "*windows*" } | Select-Object -First 1

          if (-not $asset) {
            Write-Host "ERROR: Could not find Windows compiler asset in latest release."
            exit 1
          }

          Write-Host "Downloading from: $($asset.browser_download_url)"
          $zipPath = Join-Path $env:TEMP "pawnc_official.zip"
          $extractedTemp = Join-Path $env:TEMP "pawnc_extracted_temp"
          if (Test-Path $extractedTemp) { Remove-Item $extractedTemp -Recurse -Force }

          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $extractedTemp -Force

          $foundCompiler = Get-ChildItem $extractedTemp -Recurse -File -Filter pawncc.exe | Select-Object -First 1
          if (-not $foundCompiler) {
            Write-Host "ERROR: pawncc.exe not found in downloaded archive."
            exit 1
          }

          # Копируем свежий компилятор и все DLL прямо в папку с модом
          Copy-Item (Join-Path $foundCompiler.DirectoryName "*") $compilerDir -Recurse -Force
          Write-Host "Official Pawn compiler successfully placed into $compilerDir"

          $finalCompilerExe = Join-Path $compilerDir "pawncc.exe"
          $fileInfo = Get-Item $finalCompilerExe
          Write-Host "Verified compiler size: $($fileInfo.Length) bytes"

          $bytes = [System.IO.File]::ReadAllBytes($finalCompilerExe)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            Write-Host "ERROR: pawncc.exe is not a valid PE executable!"
            exit 1
          }
          Write-Host "Valid PE executable (MZ header) confirmed."

      - name: Patch Compiler for Large Address Aware (LAA)
        shell: pwsh
        run: |
          $pwn = Get-ChildItem work -Recurse -File -Filter main.pwn | Sort-Object Length -Descending | Select-Object -First 1
          $compilerPath = Join-Path $pwn.DirectoryName "pawncc.exe"

          if (Test-Path $compilerPath) {
            $bytes = [System.IO.File]::ReadAllBytes($compilerPath)
            $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3C)
            $charOffset = $peOffset + 22
            $chars = [System.BitConverter]::ToUInt16($bytes, $charOffset)

            if (($chars -band 0x0020) -eq 0) {
              $chars = $chars -bor 0x0020
              [System.BitConverter]::GetBytes($chars).CopyTo($bytes, $charOffset)
              [System.IO.File]::WriteAllBytes($compilerPath, $bytes)
              Write-Host "Successfully patched pawncc.exe with Large Address Aware (LAA) flag!"
            } else {
              Write-Host "pawncc.exe already has LAA flag set."
            }
          }

      - name: Remove Ctrl-Z bytes from Pawn sources
        shell: pwsh
        run: |
          $files = Get-ChildItem work -Recurse -File |
            Where-Object { $_.Extension -in @(".pwn", ".inc") }

          $total = 0

          foreach ($file in $files) {
            $bytes = [IO.File]::ReadAllBytes($file.FullName)

            if ($bytes -contains 26) {
              $clean = [Collections.Generic.List[byte]]::new()

              foreach ($b in $bytes) {
                if ($b -eq 26) {
                  $total++
                } else {
                  $clean.Add($b)
                }
              }

              [IO.File]::WriteAllBytes(
                $file.FullName,
                $clean.ToArray()
              )

              Write-Host "Removed Ctrl-Z bytes from $($file.FullName)"
            }
          }

          "Removed Ctrl-Z bytes: $total" |
            Set-Content out\source_bytes.txt

          Write-Host "TOTAL Ctrl-Z bytes removed: $total"

      - name: Fix RakNet include filename if needed
        shell: pwsh
        run: |
          $target = Get-ChildItem work -Recurse -File -Filter Pawn_RakNet.inc

          if (-not $target) {
            $source = Get-ChildItem work -Recurse -File |
              Where-Object { $_.Name -ieq "Pawn.RakNet.inc" } |
              Select-Object -First 1

            $includeDir = Get-ChildItem work -Recurse -Directory -Filter include |
              Select-Object -First 1

            if ($source -and $includeDir) {
              Copy-Item $source.FullName `
                (Join-Path $includeDir.FullName "Pawn_RakNet.inc") -Force

              Write-Host "Copied alternate RakNet include filename."
            } else {
              Write-Host "No alternate RakNet include found."
            }
          }

      - name: Install Visual C++ 2010 Runtime
        shell: pwsh
        run: |
          Write-Host "Checking Visual C++ 2010 runtime..."

          foreach ($path in @(
            "$env:WINDIR\SysWOW64\MSVCR100.dll",
            "$env:WINDIR\System32\MSVCR100.dll"
          )) {
            Write-Host "$path : $(Test-Path $path)"
          }

          if (-not (
            (Test-Path "$env:WINDIR\SysWOW64\MSVCR100.dll") -or
            (Test-Path "$env:WINDIR\System32\MSVCR100.dll")
          )) {
            choco install vcredist2010 -y --no-progress
            Write-Host "Chocolatey exit code: $LASTEXITCODE"
          }

      - name: Compile main
        shell: pwsh
        run: |
          $pwn = Get-ChildItem work -Recurse -File -Filter main.pwn |
            Sort-Object Length -Descending |
            Select-Object -First 1

          if (-not $pwn) {
            Write-Host "ERROR: main.pwn not found"
            exit 1
          }

          $compiler = Get-Item (Join-Path $pwn.DirectoryName "pawncc.exe")
          $includeDirs = Get-ChildItem work -Recurse -Directory -Filter include

          $argsList = @($pwn.FullName)

          foreach ($inc in $includeDirs) {
            $argsList += "-i$($inc.FullName)"
          }

          $log = Join-Path $env:GITHUB_WORKSPACE "out\compile.log"

          Write-Host "SOURCE: $($pwn.FullName)"
          Write-Host "SOURCE SIZE: $($pwn.Length)"
          Write-Host "COMPILER: $($compiler.FullName)"
          Write-Host "INCLUDE DIRECTORIES: $($includeDirs.Count)"

          Push-Location $pwn.DirectoryName

          try {
            $processInfo = New-Object System.Diagnostics.ProcessStartInfo
            $processInfo.FileName = $compiler.FullName
            $processInfo.Arguments = [string]::Join(" ", ($argsList | ForEach-Object { "`"$_`"" }))
            $processInfo.RedirectStandardOutput = $true
            $processInfo.RedirectStandardError = $true
            $processInfo.UseShellExecute = $false
            $processInfo.CreateNoWindow = $true

            $process = New-Object System.Diagnostics.Process
            $process.StartInfo = $processInfo
            [void]$process.Start()

            $stdOut = $process.StandardOutput.ReadToEnd()
            $stdErr = $process.StandardError.ReadToEnd()
            $process.WaitForExit()

            $compileExit = $process.ExitCode
            ($stdOut + "`n" + $stdErr) | Set-Content $log -Encoding UTF8
          } catch {
            $_ | Out-String | Add-Content $log
            $compileExit = 1
          } finally {
            Pop-Location
          }

          Write-Host "COMPILER EXIT CODE: $compileExit"

          if (Test-Path $log) {
            Get-Content $log -Tail 300
          }

          "Compiler exit code: $compileExit" |
            Set-Content out\compiler_status.txt

          if ($compileExit -ne 0) {
            Write-Host "ERROR: Pawn compiler failed."
            exit 1
          }

          $amxPath = Join-Path $pwn.DirectoryName "main.amx"

          if (-not (Test-Path $amxPath)) {
            Write-Host "ERROR: main.amx was not generated"
            exit 1
          }

          $amx = Get-Item $amxPath

          Write-Host "AMX SIZE: $($amx.Length) bytes"

          if ($amx.Length -lt 1000000) {
            Write-Host "ERROR: AMX is suspiciously small."
            exit 1
          }

          Copy-Item $amxPath "out\main.amx" -Force

          Write-Host "BUILD OK"

      - name: Upload logs and AMX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-windows
          path: out/
          if-no-files-found: warn
