name: Compile Pawn Mod

on:
  push:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Visual C++ 2010 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          choco install vcredist2010 -y --no-progress

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install Visual C++ 2010 Redistributable."
          }

      - name: Extract source archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $archive = Get-ChildItem $env:GITHUB_WORKSPACE `
            -Recurse -File -Filter "src.zip" |
            Select-Object -First 1

          if (-not $archive) {
            throw "src.zip was not found."
          }

          $work = Join-Path $env:GITHUB_WORKSPACE "work"

          if (Test-Path $work) {
            Remove-Item $work -Recurse -Force
          }

          New-Item -ItemType Directory -Path $work | Out-Null

          Expand-Archive -LiteralPath $archive.FullName `
            -DestinationPath $work -Force

          Write-Host "Source extracted successfully."

      - name: Locate compiler and source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = Join-Path $env:GITHUB_WORKSPACE "work"

          $compiler = Get-ChildItem $root -Recurse -File `
            -Filter "pawncc.exe" |
            Select-Object -First 1

          if (-not $compiler) {
            throw "pawncc.exe was not found."
          }

          $source = Get-ChildItem $root -Recurse -File `
            -Filter "main.pwn" |
            Sort-Object Length -Descending |
            Select-Object -First 1

          if (-not $source) {
            throw "main.pwn was not found."
          }

          "COMPILER=$($compiler.FullName)" >> $env:GITHUB_ENV
          "SOURCE=$($source.FullName)" >> $env:GITHUB_ENV
          "SOURCE_DIR=$($source.DirectoryName)" >> $env:GITHUB_ENV

          Write-Host "Compiler: $($compiler.FullName)"
          Write-Host "Source: $($source.FullName)"
          Write-Host "Source size: $($source.Length) bytes"

      - name: Test Pawn compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $compilerDir = Split-Path $env:COMPILER -Parent
          $env:PATH = "$compilerDir;$env:SOURCE_DIR;$env:PATH"

          Write-Host "=== Compiler files ==="

          Get-ChildItem $compilerDir -Force |
            Select-Object Name, Length |
            Format-Table -AutoSize

          Write-Host "=== Testing compiler startup ==="

          Push-Location $compilerDir

          try {
            & $env:COMPILER
            $code = $LASTEXITCODE
            Write-Host "Compiler exit code: $code"

            if ($code -eq -1073741515) {
              throw "Compiler still cannot start. Another required DLL may be missing."
            }

            if ($code -eq -1073741819) {
              throw "Compiler crashed during startup."
            }
          }
          finally {
            Pop-Location
          }

      - name: Compile Pawn mod
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $compiler = $env:COMPILER
          $source = $env:SOURCE
          $sourceDir = $env:SOURCE_DIR

          $env:PATH = "$(Split-Path $compiler -Parent);$sourceDir;$env:PATH"

          Push-Location $sourceDir

          try {
            $arguments = @(
              (Split-Path $source -Leaf),
              "-d3"
            )

            $root = Join-Path $env:GITHUB_WORKSPACE "work"

            $includeDirs = Get-ChildItem $root -Directory -Recurse |
              Where-Object { $_.Name -ieq "include" } |
              Select-Object -ExpandProperty FullName -Unique

            foreach ($dir in $includeDirs) {
              $arguments += "-i$dir"
            }

            Write-Host "Starting compilation..."
            & $compiler @arguments

            $code = $LASTEXITCODE

            Write-Host "COMPILER EXIT CODE: $code"

            if ($code -ne 0) {
              throw "Pawn compilation failed with exit code $code."
            }
          }
          finally {
            Pop-Location
          }

          $amx = [System.IO.Path]::ChangeExtension($source, ".amx")

          if (-not (Test-Path $amx)) {
            throw "Compiler did not create main.amx."
          }

          $size = (Get-Item $amx).Length

          Write-Host "Compiled AMX size: $size bytes"

          if ($size -lt 100000) {
            throw "AMX is suspiciously small. Refusing to publish."
          }

          $output = Join-Path $env:GITHUB_WORKSPACE "out"

          New-Item -ItemType Directory -Path $output -Force |
            Out-Null

          Copy-Item $amx (Join-Path $output "main.amx") -Force

      - name: Upload compiled mod
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-pawn-mod
          path: out/main.amx
          if-no-files-found: error
