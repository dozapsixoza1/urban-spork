name: Compile Pawn

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force work | Out-Null
          New-Item -ItemType Directory -Force out | Out-Null

          Write-Host "Workspace prepared."

      - name: Extract source archive
        shell: pwsh
        run: |
          $archive = Get-ChildItem -Path . -Recurse -File -Filter src.zip |
            Select-Object -First 1

          if (-not $archive) {
            throw "src.zip was not found in the repository."
          }

          Write-Host "Archive: $($archive.FullName)"
          Write-Host "Archive size: $($archive.Length) bytes"

          Expand-Archive `
            -Path $archive.FullName `
            -DestinationPath "$env:GITHUB_WORKSPACE\work" `
            -Force

          Write-Host "Source archive extracted."

      - name: Install Visual C++ Redistributables
        shell: pwsh
        run: |
          choco install vcredist-all -y --no-progress

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install Visual C++ Redistributables."
          }

          Write-Host "Visual C++ Redistributables installed."

      - name: Locate Pawn compiler and source
        shell: pwsh
        run: |
          $pwn = Get-ChildItem work -Recurse -File -Filter main.pwn |
            Select-Object -First 1

          $compiler = Get-ChildItem work -Recurse -File -Filter pawncc.exe |
            Select-Object -First 1

          if (-not $pwn) {
            throw "main.pwn was not found."
          }

          if (-not $compiler) {
            throw "pawncc.exe was not found."
          }

          Write-Host "SOURCE: $($pwn.FullName)"
          Write-Host "COMPILER: $($compiler.FullName)"
          Write-Host "SOURCE SIZE: $($pwn.Length) bytes"

          "SOURCE=$($pwn.FullName)" |
            Out-File out\paths.txt -Encoding utf8

          "COMPILER=$($compiler.FullName)" |
            Out-File out\paths.txt -Append -Encoding utf8

      - name: Diagnose compiler DLL dependencies
        shell: pwsh
        run: |
          $compiler = Get-ChildItem work -Recurse -File -Filter pawncc.exe |
            Select-Object -First 1

          if (-not $compiler) {
            throw "pawncc.exe was not found."
          }

          Write-Host "========== COMPILER DIRECTORY =========="

          Get-ChildItem $compiler.DirectoryName -File |
            ForEach-Object {
              Write-Host "$($_.Name) ($($_.Length) bytes)"
            }

          Write-Host ""
          Write-Host "========== REQUIRED DLL CHECK =========="

          $dllNames = @(
            "MSVCR100.dll",
            "MSVCP100.dll",
            "MSVCR110.dll",
            "MSVCP110.dll",
            "MSVCR120.dll",
            "MSVCP120.dll",
            "VCRUNTIME140.dll",
            "MSVCP140.dll",
            "PAWNC.dll",
            "pawnc.dll"
          )

          foreach ($name in $dllNames) {
            $found = $false

            $locations = @(
              (Join-Path $compiler.DirectoryName $name),
              (Join-Path "$env:WINDIR\System32" $name),
              (Join-Path "$env:WINDIR\SysWOW64" $name)
            )

            foreach ($location in $locations) {
              if (Test-Path $location) {
                Write-Host "FOUND: $location"
                $found = $true
              }
            }

            if (-not $found) {
              Write-Host "NOT FOUND: $name"
            }
          }

          Write-Host ""
          Write-Host "========== COMPILER STARTUP TEST =========="

          Push-Location $compiler.DirectoryName

          try {
            & $compiler.FullName 2>&1 |
              ForEach-Object {
                Write-Host $_
              }

            $exitCode = $LASTEXITCODE
          }
          finally {
            Pop-Location
          }

          Write-Host "STARTUP TEST EXIT CODE: $exitCode"

          if ($exitCode -eq -1073741515) {
            Write-Host "ERROR: Windows could not load a required DLL."
          }

      - name: Discover include directories
        shell: pwsh
        run: |
          $pwn = Get-ChildItem work -Recurse -File -Filter main.pwn |
            Select-Object -First 1

          if (-not $pwn) {
            throw "main.pwn was not found."
          }

          $directories = @(
            $pwn.DirectoryName
          )

          $includeDirectories = Get-ChildItem work `
            -Recurse `
            -Directory |
            Where-Object {
              $_.Name -ieq "include"
            }

          foreach ($directory in $includeDirectories) {
            $directories += $directory.FullName
          }

          $allFiles = Get-ChildItem work -Recurse -File

          $raknetFiles = $allFiles |
            Where-Object {
              $_.BaseName -ieq "Pawn_RakNet" -or
              $_.BaseName -ieq "Pawn.RakNet" -or
              $_.BaseName -ieq "PawnRakNet"
            }

          foreach ($file in $raknetFiles) {
            $directories += $file.DirectoryName
          }

          $directories = @(
            $directories |
              Where-Object { $_ } |
              Select-Object -Unique
          )

          $directories |
            Set-Content out\include_dirs.txt -Encoding utf8

          Write-Host "Include directories: $($directories.Count)"

          foreach ($directory in $directories) {
            Write-Host $directory
          }

          Write-Host ""
          Write-Host "========== RAKNET INCLUDE FILES =========="

          if ($raknetFiles) {
            foreach ($file in $raknetFiles) {
              Write-Host $file.FullName
            }
          }
          else {
            Write-Host "No matching Pawn.RakNet include was found."
          }

      - name: Diagnose invalid Pawn character constants
        shell: pwsh
        run: |
          $pwn = Get-ChildItem work -Recurse -File -Filter main.pwn |
            Select-Object -First 1

          if (-not $pwn) {
            throw "main.pwn was not found."
          }

          $lines = [System.IO.File]::ReadAllLines($pwn.FullName)

          $targets = @(
            37970,
            38016,
            38095,
            49498,
            49516,
            52094
          )

          foreach ($target in $targets) {
            Write-Host ""
            Write-Host "========== LINE $target =========="

            if ($target -gt $lines.Length) {
              Write-Host "Line is outside the source file."
              continue
            }

            $start = [Math]::Max(1, $target - 3)
            $end = [Math]::Min($lines.Length, $target + 3)

            for ($i = $start; $i -le $end; $i++) {
              $line = $lines[$i - 1]
              $escaped = ConvertTo-Json -InputObject $line -Compress

              Write-Host "${i}: $escaped"
            }
          }

      - name: Compile main
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $pwn = Get-ChildItem work -Recurse -File -Filter main.pwn |
            Select-Object -First 1

          $compiler = Get-ChildItem work -Recurse -File -Filter pawncc.exe |
            Select-Object -First 1

          if (-not $pwn -or -not $compiler) {
            throw "main.pwn or pawncc.exe was not found."
          }

          $log = Join-Path $env:GITHUB_WORKSPACE "out\compile.log"

          $arguments = @(
            "main.pwn",
            "-d3"
          )

          if (Test-Path out\include_dirs.txt) {
            $directories = Get-Content out\include_dirs.txt

            foreach ($directory in $directories) {
              if ($directory -and (Test-Path $directory)) {
                $arguments += "-i$directory"
              }
            }
          }

          Write-Host "========================================"
          Write-Host "COMPILING SOURCE: $($pwn.FullName)"
          Write-Host "USING COMPILER: $($compiler.FullName)"
          Write-Host "INCLUDE DIRECTORIES: $($arguments.Count - 2)"
          Write-Host "========================================"

          Push-Location $pwn.DirectoryName

          try {
            & $compiler.FullName @arguments *> $log
            $compileExit = $LASTEXITCODE
          }
          catch {
            $_ | Out-String | Out-File $log -Append
            $compileExit = 1
          }
          finally {
            Pop-Location
          }

          Write-Host "COMPILER EXIT CODE: $compileExit"

          "Compiler exit code: $compileExit" |
            Out-File out\compiler_status.txt -Encoding utf8

          if (Test-Path $log) {
            Get-Content $log -Tail 200
          }

          if ($compileExit -eq -1073741515) {
            Write-Host ""
            Write-Host "ERROR: A required DLL is missing."
            Write-Host "See the DLL diagnostic step."
            exit 1
          }

          if ($compileExit -ne 0) {
            Write-Host ""
            Write-Host "ERROR: Pawn compilation failed."
            exit 1
          }

          $amxPath = Join-Path $pwn.DirectoryName "main.amx"

          if (-not (Test-Path $amxPath)) {
            throw "Compilation returned success, but main.amx was not created."
          }

          $amx = Get-Item $amxPath

          Write-Host "AMX SIZE: $($amx.Length) bytes"

          Copy-Item $amxPath out\main.amx -Force

          Write-Host "AMX copied to out\main.amx"

      - name: Upload build results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-windows
          path: out/
          if-no-files-found: warn
