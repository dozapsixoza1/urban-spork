name: Compile Pawn

on:
  workflow_dispatch:
  push:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install runtimes
        shell: pwsh
        continue-on-error: true
        run: choco install vcredist2005 vcredist2008 vcredist2010 vcredist140 -y --no-progress

      - name: Unzip
        shell: pwsh
        run: Expand-Archive -Path src.zip -DestinationPath work -Force

      - name: RakNet include fix
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $has = Get-ChildItem work -Recurse -Filter Pawn_RakNet.inc
          $incdir = Get-ChildItem work -Recurse -Directory -Filter include | Select-Object -First 1

          if ($has) {
            Write-Host "Pawn_RakNet.inc already present"
          }
          else {
            $dot = Get-ChildItem work -Recurse -Filter Pawn.RakNet.inc | Select-Object -First 1

            if ($dot -and $incdir) {
              Copy-Item $dot.FullName (Join-Path $incdir.FullName "Pawn_RakNet.inc")
              Write-Host "copied Pawn.RakNet.inc as Pawn_RakNet.inc"
            }
            else {
              Write-Host "RAKNET INC NOT FOUND or include directory missing"
            }
          }

      - name: Debug alias support
        shell: pwsh
        run: |
          Write-Host "========== FIND MAIN.PWN =========="

          $pwn = Get-ChildItem work -Recurse -Filter main.pwn |
            Sort-Object Length -Descending |
            Select-Object -First 1

          if (-not $pwn) {
            Write-Host "ERROR: main.pwn not found"
            exit 1
          }

          Write-Host "MAIN: $($pwn.FullName)"

          Write-Host "`n========== MAIN.PWN INCLUDES =========="

          Select-String -Path $pwn.FullName `
            -Pattern '^\s*#\s*include' |
            ForEach-Object {
              Write-Host $_.LineNumber ":" $_.Line
            }

          Write-Host "`n========== SEARCH ALIAS DEFINITIONS =========="

          $sources = Get-ChildItem work -Recurse -File |
            Where-Object {
              $_.Extension -in @(".inc", ".pwn")
            }

          $matches = $sources |
            Select-String -Pattern '^\s*#\s*define\s+alias\b'

          if ($matches) {
            $matches | ForEach-Object {
              Write-Host "$($_.Path):$($_.LineNumber): $($_.Line)"
            }
          }
          else {
            Write-Host "NO ALIAS MACRO DEFINITION FOUND"
          }

          Write-Host "`n========== PAWN.CMD FILES =========="

          Get-ChildItem work -Recurse -File |
            Where-Object {
              $_.Name -match 'pawn.?cmd|y.?commands|zcmd'
            } |
            ForEach-Object {
              Write-Host $_.FullName
            }

      - name: Compile
        shell: pwsh
        run: |
          New-Item out -ItemType Directory -Force | Out-Null

          $pwn = Get-ChildItem work -Recurse -Filter main.pwn |
            Sort-Object Length -Descending |
            Select-Object -First 1

          $cc = Get-ChildItem work -Recurse -Filter pawncc.exe |
            Select-Object -First 1

          if (-not $pwn -or -not $cc) {
            Write-Host "ERROR: main.pwn or pawncc.exe not found"
            exit 1
          }

          $opts = @("main.pwn", "-d3")

          Get-ChildItem work -Recurse -Directory -Filter include |
            ForEach-Object {
              $opts += ("-i" + $_.FullName)
            }

          Push-Location $pwn.DirectoryName

          & $cc.FullName @opts *> "$env:GITHUB_WORKSPACE\out\compile.log"

          Write-Host "exit code: $LASTEXITCODE"

          Pop-Location

          Get-Content "$env:GITHUB_WORKSPACE\out\compile.log" -Tail 60

          if (Test-Path "$($pwn.DirectoryName)\main.amx") {
            Copy-Item "$($pwn.DirectoryName)\main.amx" out\
            Write-Host "main.amx OK"
          }

          exit 0

      - name: Show error lines
        if: always()
        shell: pwsh
        run: |
          $report = @()

          if (Test-Path out\compile.log) {
            $errs = Get-Content out\compile.log |
              Where-Object {
                $_ -match '^(.+?)\((\d+)\) : (error|fatal)'
              } |
              Select-Object -First 8

            foreach ($e in $errs) {
              if ($e -match '^(.+?)\((\d+)\) : ') {
                $f = $Matches[1]
                $n = [int]$Matches[2]
                $rel = $f.Replace('\','/')

                $p = Get-ChildItem work -Recurse -Filter (Split-Path $f -Leaf) |
                  Where-Object {
                    $_.FullName.Replace('\','/') -like "*$rel"
                  } |
                  Select-Object -First 1

                $report += "=== $f line $n"

                if ($p) {
                  $lines = Get-Content $p.FullName

                  for (
                    $i = [Math]::Max(1, $n-3);
                    $i -le [Math]::Min($lines.Count, $n+1);
                    $i++
                  ) {
                    $report += ("{0}: {1}" -f $i, $lines[$i-1])
                  }
                }
                else {
                  $report += "file not found in archive"
                }
              }
            }
          }

          $report | Out-File out\error_lines.txt
          $report | ForEach-Object { Write-Host $_ }

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-windows
          path: out
