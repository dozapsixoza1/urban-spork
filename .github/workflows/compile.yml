name: Compile Pawn

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force work | Out-Null
          New-Item -ItemType Directory -Force out | Out-Null

      - name: Extract source archive
        shell: pwsh
        run: |
          $archive = Get-ChildItem -Path . -Recurse -File -Filter src.zip |
            Select-Object -First 1

          if (-not $archive) {
            throw "src.zip was not found."
          }

          Expand-Archive `
            -Path $archive.FullName `
            -DestinationPath "$env:GITHUB_WORKSPACE\work" `
            -Force

          Write-Host "Archive extracted: $($archive.FullName)"

      - name: Locate compiler and source
        shell: pwsh
        run: |
          $sources = @(Get-ChildItem work -Recurse -File -Filter main.pwn)
          $compilers = @(Get-ChildItem work -Recurse -File -Filter pawncc.exe)

          Write-Host "Found main.pwn files: $($sources.Count)"
          Write-Host "Found pawncc.exe files: $($compilers.Count)"

          foreach ($source in $sources) {
            Write-Host "SOURCE: $($source.FullName)"
            Write-Host "SIZE: $($source.Length) bytes"
          }

          if ($sources.Count -eq 0) {
            throw "main.pwn not found."
          }

          if ($compilers.Count -eq 0) {
            throw "pawncc.exe not found."
          }

          $pwn = $sources |
            Sort-Object Length -Descending |
            Select-Object -First 1

          $compiler = $compilers |
            Select-Object -First 1

          "SOURCE=$($pwn.FullName)" |
            Set-Content out\paths.txt -Encoding utf8

          "COMPILER=$($compiler.FullName)" |
            Add-Content out\paths.txt -Encoding utf8

      - name: Diagnose Pawn source
        shell: pwsh
        run: |
          $pwn = Get-ChildItem work -Recurse -File -Filter main.pwn |
            Sort-Object Length -Descending |
            Select-Object -First 1

          if (-not $pwn) {
            throw "main.pwn not found."
          }

          $lines = [System.IO.File]::ReadAllLines($pwn.FullName)

          Write-Host "SOURCE: $($pwn.FullName)"
          Write-Host "SOURCE SIZE: $($pwn.Length)"
          Write-Host "SOURCE LINES: $($lines.Length)"

          Write-Host ""
          Write-Host "========== FIRST 100 LINES =========="

          for ($i = 0; $i -lt [Math]::Min(100, $lines.Length); $i++) {
            Write-Host ("{0}: {1}" -f ($i + 1), $lines[$i])
          }

          Write-Host ""
          Write-Host "========== INCLUDE DIRECTIVES =========="

          Select-String -Path $pwn.FullName `
            -Pattern '^\s*#\s*include\b' |
            ForEach-Object {
              Write-Host "$($_.LineNumber): $($_.Line.Trim())"
            }

          Write-Host ""
          Write-Host "========== PUBLIC CALLBACKS =========="

          Select-String -Path $pwn.FullName `
            -Pattern '^\s*public\s+[A-Za-z_][A-Za-z0-9_]*\s*\(' |
            Select-Object -First 100 |
            ForEach-Object {
              Write-Host "$($_.LineNumber): $($_.Line.Trim())"
            }

      - name: Discover include directories
        shell: pwsh
        run: |
          $pwn = Get-ChildItem work -Recurse -File -Filter main.pwn |
            Sort-Object Length -Descending |
            Select-Object -First 1

          $directories = @($pwn.DirectoryName)

          Get-ChildItem work -Recurse -Directory |
            Where-Object { $_.Name -ieq "include" } |
            ForEach-Object {
              $directories += $_.FullName
            }

          $directories = @(
            $directories |
              Select-Object -Unique
          )

          $directories |
            Set-Content out\include_dirs.txt -Encoding utf8

          Write-Host "Include directories: $($directories.Count)"

          foreach ($directory in $directories) {
            Write-Host $directory
          }

      - name: Compile main
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force out | Out-Null

          $pwn = Get-ChildItem work -Recurse -File -Filter main.pwn |
            Sort-Object Length -Descending |
            Select-Object -First 1

          $compiler = Get-ChildItem work -Recurse -File -Filter pawncc.exe |
            Select-Object -First 1

          if (-not $pwn) {
            throw "main.pwn not found."
          }

          if (-not $compiler) {
            throw "pawncc.exe not found."
          }

          $log = Join-Path $env:GITHUB_WORKSPACE "out\compile.log"

          $arguments = @(
            $pwn.FullName,
            "-d3"
          )

          if (Test-Path out\include_dirs.txt) {
            foreach ($directory in (Get-Content out\include_dirs.txt)) {
              if ($directory -and (Test-Path $directory)) {
                $arguments += "-i$directory"
              }
            }
          }

          Write-Host "COMPILING: $($pwn.FullName)"
          Write-Host "COMPILER: $($compiler.FullName)"

          & $compiler.FullName @arguments *> $log
          $compileExit = $LASTEXITCODE

          Write-Host "COMPILER EXIT CODE: $compileExit"
          Get-Content $log -Tail 200

          if ($compileExit -ne 0) {
            throw "Pawn compilation failed with exit code $compileExit."
          }

          $amxPath = [System.IO.Path]::ChangeExtension(
            $pwn.FullName,
            ".amx"
          )

          if (-not (Test-Path $amxPath)) {
            throw "Compiler did not produce the expected AMX file."
          }

          $amx = Get-Item $amxPath

          Write-Host "AMX SIZE: $($amx.Length) bytes"

          if ($amx.Length -lt 100000) {
            throw "AMX is too small. Source diagnostics are required."
          }

          Copy-Item $amxPath out\main.amx -Force

          Write-Host "AMX validated and copied."

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-windows
          path: out/
          if-no-files-found: warn
