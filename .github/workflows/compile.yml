name: Compile Pawn
on:
  workflow_dispatch:
  push:
jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -y
          sudo apt-get install -y libc6:i386 libgcc-s1:i386 unzip
          mkdir -p work newcc out
          unzip -q src.zip -d work
          find work -maxdepth 3 > out/tree.txt
          gh release download -R pawn-lang/compiler -p "*linux.tar.gz" -D newcc
          tar -xzf newcc/*.tar.gz -C newcc
          find newcc -type f | head -20
      - name: Compile
        run: |
          set +e
          CC=$(find "$PWD/newcc" -name pawncc -type f | head -1)
          LIB=$(dirname "$(find "$PWD/newcc" -name 'libpawnc.so*' | head -1)")
          chmod +x "$CC"
          PWN=$(find "$PWD/work" -name main.pwn -printf '%s %p\n' | sort -rn | head -1 | cut -d' ' -f2-)
          INC=""
          for d in $(find "$PWD/work" -type d -name include); do INC="$INC -i$d"; done
          echo "pwn: $PWN"
          cd "$(dirname "$PWN")"
          LD_LIBRARY_PATH="$LIB" "$CC" main.pwn -d3 $INC > "$GITHUB_WORKSPACE/out/compile.log" 2>&1
          echo "exit code: $?"
          tail -n 60 "$GITHUB_WORKSPACE/out/compile.log"
          if [ -f main.amx ]; then cp main.amx "$GITHUB_WORKSPACE/out/"; echo "main.amx OK"; fi
          exit 0
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-linux
          path: out
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install runtimes
        shell: pwsh
        continue-on-error: true
        run: choco install vcredist2005 vcredist2008 vcredist2010 vcredist140 -y --no-progress
      - name: Unzip
        shell: pwsh
        run: Expand-Archive -Path src.zip -DestinationPath work -Force
      - name: Compile
        shell: pwsh
        run: |
          New-Item out -ItemType Directory -Force | Out-Null
          $pwn = Get-ChildItem work -Recurse -Filter main.pwn | Sort-Object Length -Descending | Select-Object -First 1
          $cc = Get-ChildItem work -Recurse -Filter pawncc.exe | Select-Object -First 1
          $opts = @("main.pwn", "-d3")
          Get-ChildItem work -Recurse -Directory -Filter include | ForEach-Object { $opts += ("-i" + $_.FullName) }
          Push-Location $pwn.DirectoryName
          & $cc.FullName @opts *> "$env:GITHUB_WORKSPACE\out\compile.log"
          Write-Host "exit code: $LASTEXITCODE"
          Pop-Location
          Get-Content "$env:GITHUB_WORKSPACE\out\compile.log" -Tail 60
          if (Test-Path "$($pwn.DirectoryName)\main.amx") { Copy-Item "$($pwn.DirectoryName)\main.amx" out\; Write-Host "main.amx OK" }
          exit 0
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-windows
          path: out
