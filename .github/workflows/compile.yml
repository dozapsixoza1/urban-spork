name: Compile Pawn Mod

on:
  push:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $archive = Get-ChildItem $env:GITHUB_WORKSPACE -Recurse -File -Filter "src.zip" |
            Select-Object -First 1

          if (-not $archive) {
            throw "src.zip was not found in the repository."
          }

          $work = Join-Path $env:GITHUB_WORKSPACE "work"

          if (Test-Path $work) {
            Remove-Item $work -Recurse -Force
          }

          New-Item -ItemType Directory -Path $work | Out-Null

          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $work -Force

          Write-Host "Archive extracted to: $work"

      - name: Locate Pawn compiler and source
        id: locate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = Join-Path $env:GITHUB_WORKSPACE "work"

          $compiler = Get-ChildItem $root -Recurse -File -Filter "pawncc.exe" |
            Select-Object -First 1

          if (-not $compiler) {
            throw "pawncc.exe was not found inside src.zip."
          }

          $source = Get-ChildItem $root -Recurse -File -Filter "main.pwn" |
            Sort-Object Length -Descending |
            Select-Object -First 1

          if (-not $source) {
            throw "main.pwn was not found inside src.zip."
          }

          "COMPILER=$($compiler.FullName)" >> $env:GITHUB_ENV
          "SOURCE=$($source.FullName)" >> $env:GITHUB_ENV
          "SOURCE_DIR=$($source.DirectoryName)" >> $env:GITHUB_ENV

          Write-Host "Compiler: $($compiler.FullName)"
          Write-Host "Source:   $($source.FullName)"
          Write-Host "Source size: $($source.Length) bytes"

      - name: Diagnose compiler dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== Compiler directory ==="

          Get-ChildItem (Split-Path $env:COMPILER -Parent) -Force |
            Select-Object Name, Length |
            Format-Table -AutoSize

          Write-Host "=== DLL files in extracted source ==="

          Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE "work") `
            -Recurse -File -Filter "*.dll" |
            Select-Object FullName, Length |
            Format-Table -AutoSize

          Write-Host "=== Compiler startup test ==="

          Push-Location (Split-Path $env:COMPILER -Parent)

          try {
            & $env:COMPILER 2>&1 |
              ForEach-Object { Write-Host "$_" }

            $code = $LASTEXITCODE
            Write-Host "Compiler exit code: $code"

            if ($code -eq -1073741515) {
              Write-Host "ERROR: Windows reports a missing DLL or runtime dependency."
            }
          }
          finally {
            Pop-Location
          }

      - name: Prepare compiler runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $compilerDir = Split-Path $env:COMPILER -Parent

          # Add compiler and source directories to PATH so adjacent DLLs
          # can be found when the executable starts.
          $env:PATH = "$compilerDir;$env:SOURCE_DIR;$env:PATH"

          Write-Host "Checking common Pawn runtime files..."

          $names = @(
            "pawncc.exe",
            "pawnc.dll",
            "libpawnc.dll"
          )

          foreach ($name in $names) {
            $found = Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE "work") `
              -Recurse -File -Filter $name |
              Select-Object -First 1

            if ($found) {
              Write-Host "$name => $($found.FullName)"
            }
            else {
              Write-Host "$name => not found"
            }
          }

          "PATH=$env:PATH" >> $env:GITHUB_ENV

      - name: Compile Pawn mod
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $compiler = $env:COMPILER
          $source = $env:SOURCE
          $sourceDir = $env:SOURCE_DIR

          Write-Host "COMPILER: $compiler"
          Write-Host "SOURCE:   $source"

          # Run from the source directory so relative includes work.
          Push-Location $sourceDir

          try {
            $arguments = @(
              (Split-Path $source -Leaf),
              "-d3"
            )

            # Add all include directories found in the extracted archive.
            $includeDirs = Get-ChildItem `
              (Join-Path $env:GITHUB_WORKSPACE "work") `
              -Directory -Recurse |
              Where-Object { $_.Name -ieq "include" } |
              Select-Object -ExpandProperty FullName -Unique

            foreach ($dir in $includeDirs) {
              $arguments += "-i$dir"
            }

            Write-Host "Compiler arguments:"
            $arguments | ForEach-Object { Write-Host "  $_" }

            & $compiler @arguments
            $compileExit = $LASTEXITCODE

            Write-Host "COMPILER EXIT CODE: $compileExit"

            if ($compileExit -eq -1073741515) {
              throw "Pawn Compiler cannot start: Windows error 0xC0000135. A required DLL/runtime is missing. Check the Diagnose compiler dependencies step."
            }

            if ($compileExit -ne 0) {
              throw "Pawn compilation failed with exit code $compileExit."
            }
          }
          finally {
            Pop-Location
          }

          $amx = [System.IO.Path]::ChangeExtension($source, ".amx")

          if (-not (Test-Path $amx)) {
            throw "Compilation returned success, but the AMX file was not created: $amx"
          }

          $size = (Get-Item $amx).Length

          Write-Host "AMX file: $amx"
          Write-Host "AMX size: $size bytes"

          if ($size -lt 100000) {
            throw "AMX is suspiciously small ($size bytes). Refusing to publish an incomplete mod."
          }

          $output = Join-Path $env:GITHUB_WORKSPACE "out"

          New-Item -ItemType Directory -Path $output -Force | Out-Null

          Copy-Item $amx (Join-Path $output "main.amx") -Force

          Write-Host "Compiled mod copied to: $output\main.amx"

      - name: Upload compiled AMX
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-pawn-mod
          path: out/main.amx
          if-no-files-found: error
