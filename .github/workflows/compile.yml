name: Compile Pawn
on:
  workflow_dispatch:
  push:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install runtimes
        shell: pwsh
        continue-on-error: true
        run: choco install vcredist2005 vcredist2008 vcredist2010 vcredist140 -y --no-progress
      - name: Unzip
        shell: pwsh
        run: Expand-Archive -Path src.zip -DestinationPath work -Force
      - name: Use fixed main.pwn from repo root
        shell: pwsh
        run: |
          if (Test-Path main.pwn) {
            $t = Get-ChildItem work -Recurse -Filter main.pwn | Sort-Object Length -Descending | Select-Object -First 1
            Copy-Item main.pwn $t.FullName -Force
            Write-Host "overlaid main.pwn onto $($t.FullName)"
          } else { Write-Host "no main.pwn in repo root, using the one from src.zip" }
      - name: Check main.pwn encoding
        shell: pwsh
        run: |
          $t = Get-ChildItem work -Recurse -Filter main.pwn | Sort-Object Length -Descending | Select-Object -First 1
          $bytes = [System.IO.File]::ReadAllBytes($t.FullName)
          Write-Host "main.pwn: $($t.FullName) size $($bytes.Length)"
          $i = [Array]::IndexOf($bytes, [byte]26)
          if ($i -ge 0) {
            $line = 1 + ($bytes[0..$i] | Where-Object { $_ -eq 10 }).Count
            Write-Host "FAIL: byte 0x1A (DOS end-of-file) found at offset $i, line $line. The file was re-saved in a wrong encoding."
            exit 1
          }
          Write-Host "encoding OK: no 0x1A bytes"
      - name: RakNet include fix
        shell: pwsh
        run: |
          $has = Get-ChildItem work -Recurse -Filter Pawn_RakNet.inc
          $incdir = Get-ChildItem work -Recurse -Directory -Filter include | Select-Object -First 1
          if ($has) { Write-Host "Pawn_RakNet.inc already present" }
          else {
            $dot = Get-ChildItem work -Recurse -Filter Pawn.RakNet.inc | Select-Object -First 1
            if ($dot) {
              Copy-Item $dot.FullName (Join-Path $incdir.FullName "Pawn_RakNet.inc")
              Write-Host "copied Pawn.RakNet.inc as Pawn_RakNet.inc"
            } else { Write-Host "RAKNET INC NOT FOUND" }
          }
      - name: Compile
        shell: pwsh
        run: |
          New-Item out -ItemType Directory -Force | Out-Null
          $pwn = Get-ChildItem work -Recurse -Filter main.pwn | Sort-Object Length -Descending | Select-Object -First 1
          $cc = Get-ChildItem work -Recurse -Filter pawncc.exe | Select-Object -First 1
          $opts = @("main.pwn", "-d3")
          Get-ChildItem work -Recurse -Directory -Filter include | ForEach-Object { $opts += ("-i" + $_.FullName) }
          Push-Location $pwn.DirectoryName
          & $cc.FullName @opts *> "$env:GITHUB_WORKSPACE\out\compile.log"
          Write-Host "exit code: $LASTEXITCODE"
          Get-Content "$env:GITHUB_WORKSPACE\out\compile.log" -Tail 60
          $amx = Join-Path $pwn.DirectoryName "main.amx"
          $size = 0
          if (Test-Path $amx) { $size = (Get-Item $amx).Length; Copy-Item $amx "$env:GITHUB_WORKSPACE\out\main.amx" }
          Pop-Location
          Write-Host "AMX size: $size"
          if ($size -lt 1000000) { Write-Host "BUILD FAILED: AMX is smaller than 1 MB"; exit 1 }
          Write-Host "BUILD OK"
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: out
